let currentIndex = 0;
let userAnswers = new Array(questions.length).fill(null);
let timeRemaining = 3600; // 60 minutes in seconds
let timerInterval;

const elements = {
    progressText: document.getElementById('progress-text'),
    timerDisplay: document.getElementById('timer-display'),
    qText: document.getElementById('q-text'),
    snippetContainer: document.getElementById('q-snippet-container'),
    optionsBox: document.getElementById('options-box'),
    feedbackBox: document.getElementById('feedback-box'),
    btnPrev: document.getElementById('btn-prev'),
    btnNext: document.getElementById('btn-next'),
    btnSubmit: document.getElementById('btn-submit'),
    quizApp: document.getElementById('quiz-app'),
    reviewSection: document.getElementById('review-section'),
    finalScore: document.getElementById('final-score'),
    reviewList: document.getElementById('review-list')
};

function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function startTimer() {
    timerInterval = setInterval(() => {
        timeRemaining--;
        elements.timerDisplay.innerText = formatTime(timeRemaining);
        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            showReview();
        }
    }, 1000);
}

function renderQuestion() {
    const q = questions[currentIndex];
    elements.progressText.innerText = `Question ${currentIndex + 1} of ${questions.length}`;
    elements.qText.innerHTML = q.text;

    // Render snippet if exists
    if (q.snippet && q.snippet.trim() !== "") {
        elements.snippetContainer.innerHTML = `<div class="snippet">${escapeHtml(q.snippet)}</div>`;
    } else {
        elements.snippetContainer.innerHTML = "";
    }

    // Render options
    elements.optionsBox.innerHTML = "";
    q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = opt;
        
        // If already answered
        if (userAnswers[currentIndex] !== null) {
            btn.disabled = true;
            if (idx === q.answer) {
                btn.classList.add("correct");
            } else if (idx === userAnswers[currentIndex]) {
                btn.classList.add("incorrect");
            }
        } else {
            btn.onclick = () => handleSelect(idx);
        }
        elements.optionsBox.appendChild(btn);
    });

    // Handle feedback display
    if (userAnswers[currentIndex] !== null) {
        showFeedback(userAnswers[currentIndex] === q.answer, q.explanation);
    } else {
        elements.feedbackBox.style.display = "none";
    }

    // Nav buttons
    elements.btnPrev.disabled = currentIndex === 0;
    if (currentIndex === questions.length - 1) {
        elements.btnNext.style.display = "none";
        elements.btnSubmit.style.display = "block";
    } else {
        elements.btnNext.style.display = "block";
        elements.btnSubmit.style.display = "none";
    }

    // Render MathJax
    if (window.MathJax) {
        MathJax.typesetPromise();
    }
}

function handleSelect(selectedIndex) {
    if (userAnswers[currentIndex] !== null) return; // Prevent double click
    
    userAnswers[currentIndex] = selectedIndex;
    const q = questions[currentIndex];
    const isCorrect = selectedIndex === q.answer;
    
    renderQuestion(); // Re-render to show colors and disable buttons
    showFeedback(isCorrect, q.explanation);
}

function showFeedback(isCorrect, explanation) {
    elements.feedbackBox.style.display = "block";
    elements.feedbackBox.className = `feedback ${isCorrect ? 'correct-bg' : 'incorrect-bg'}`;
    elements.feedbackBox.innerHTML = `
        <strong>${isCorrect ? 'Correct!' : 'Incorrect.'}</strong><br>
        ${explanation}
    `;
    if (window.MathJax) MathJax.typesetPromise([elements.feedbackBox]);
}

function navigate(dir) {
    if ((dir === -1 && currentIndex > 0) || (dir === 1 && currentIndex < questions.length - 1)) {
        currentIndex += dir;
        renderQuestion();
    }
}

function showReview() {
    clearInterval(timerInterval);
    elements.quizApp.style.display = "none";
    elements.reviewSection.style.display = "block";

    let score = 0;
    userAnswers.forEach((ans, idx) => {
        if (ans === questions[idx].answer) score++;
    });

    elements.finalScore.innerText = `You scored ${score} out of ${questions.length} (${((score/questions.length)*100).toFixed(1)}%)`;

    elements.reviewList.innerHTML = "";
    questions.forEach((q, idx) => {
        const ans = userAnswers[idx];
        const isCorrect = ans === q.answer;
        const statusStr = ans === null ? '<span style="color:orange">Unanswered</span>' : (isCorrect ? '<span style="color:green">Correct</span>' : '<span style="color:red">Incorrect</span>');
        
        let userAnsStr = ans === null ? "None" : q.options[ans];
        
        const card = document.createElement("div");
        card.className = "review-card";
        card.innerHTML = `
            <h4>Q${idx+1}: ${q.text}</h4>
            ${q.snippet ? `<div class="snippet">${escapeHtml(q.snippet)}</div>` : ''}
            <p><strong>Status:</strong> ${statusStr}</p>
            <p><strong>Your Answer:</strong> ${userAnsStr}</p>
            <p><strong>Correct Answer:</strong> ${q.options[q.answer]}</p>
            <p style="background: #f1f5f9; padding: 10px; border-radius: 5px;"><strong>Explanation:</strong> ${q.explanation}</p>
        `;
        elements.reviewList.appendChild(card);
    });

    if (window.MathJax) MathJax.typesetPromise([elements.reviewList]);
}

function escapeHtml(unsafe) {
    return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// Init
startTimer();
renderQuestion();
</script>
