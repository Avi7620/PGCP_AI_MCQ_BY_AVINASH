<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced AI & Math Quiz</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --correct: #16a34a;
            --correct-bg: #dcfce7;
            --incorrect: #dc2626;
            --incorrect-bg: #fee2e2;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .timer-score {
            font-size: 1.1em;
            font-weight: bold;
            display: flex;
            gap: 20px;
        }

        #timer { color: var(--incorrect); }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            margin-bottom: 25px;
        }

        .nav-btn {
            padding: 6px;
            font-size: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover { background: #e2e8f0; }
        .nav-btn.active { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
        .nav-btn.answered-correct { background: var(--correct); color: white; border-color: var(--correct); }
        .nav-btn.answered-incorrect { background: var(--incorrect); color: white; border-color: var(--incorrect); }

        .question-box { margin-bottom: 30px; }
        
        .question-title {
            font-size: 1.25em;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .snippet {
            background: #1e293b;
            color: #f8fafc;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            text-align: left;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
        .option-btn:disabled { cursor: default; }

        .option-btn.correct { background: var(--correct-bg); border-color: var(--correct); color: #14532d; font-weight: 600; }
        .option-btn.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect); color: #7f1d1d; }

        .feedback-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            display: none;
            background: #f1f5f9;
            border-left: 5px solid var(--primary);
        }

        .feedback-box h4 { margin: 0 0 10px 0; }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            border-top: 2px solid var(--border);
            padding-top: 20px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            color: white;
            background: var(--primary);
            transition: background 0.2s;
        }

        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        
        .btn-finish { background: var(--text-main); }
        .btn-finish:hover { background: #000; }

        /* Review Screen */
        #review-screen { display: none; }
        .review-item {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .review-item.correct { border-left: 5px solid var(--correct); }
        .review-item.incorrect { border-left: 5px solid var(--incorrect); }
        .review-item.unanswered { border-left: 5px solid var(--text-muted); }
        
        .review-header {
            font-size: 1.5em;
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="container" id="quiz-container">
    <header>
        <h2>AI & Math Assessment</h2>
        <div class="timer-score">
            <span id="timer">60:00</span>
            <span id="score-display">Score: 0 / 46</span>
        </div>
    </header>

    <div class="nav-grid" id="nav-grid"></div>

    <div class="question-box">
        <div class="question-title" id="question-text"></div>
        <div class="snippet" id="question-snippet" style="display: none;"></div>
        <div class="options-list" id="options-container"></div>
    </div>

    <div class="feedback-box" id="feedback-container">
        <h4 id="feedback-status"></h4>
        <p><strong>Correct Answer: </strong><span id="feedback-correct-answer"></span></p>
        <p><strong>Theory / Reason: </strong><span id="feedback-theory"></span></p>
    </div>

    <div class="controls">
        <button class="btn" id="btn-prev" onclick="changeQuestion(-1)">Previous</button>
        <button class="btn btn-finish" id="btn-finish" onclick="endQuiz()">Finish Quiz</button>
        <button class="btn" id="btn-next" onclick="changeQuestion(1)">Next</button>
    </div>
</div>

<div class="container" id="review-screen">
    <div class="review-header">
        <h2>Quiz Completed!</h2>
        <h3 id="final-score-text"></h3>
    </div>
    <div id="review-list"></div>
</div>

    let currentIndex = 0;
    let score = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let timeLeft = 3600; // 1 hour in seconds
    let timerInterval;

    const UI = {
        questionText: document.getElementById('question-text'),
        snippet: document.getElementById('question-snippet'),
        optionsContainer: document.getElementById('options-container'),
        navGrid: document.getElementById('nav-grid'),
        feedbackBox: document.getElementById('feedback-container'),
        feedbackStatus: document.getElementById('feedback-status'),
        feedbackCorrect: document.getElementById('feedback-correct-answer'),
        feedbackTheory: document.getElementById('feedback-theory'),
        btnPrev: document.getElementById('btn-prev'),
        btnNext: document.getElementById('btn-next'),
        scoreDisplay: document.getElementById('score-display'),
        timerDisplay: document.getElementById('timer'),
        quizContainer: document.getElementById('quiz-container'),
        reviewScreen: document.getElementById('review-screen'),
        reviewList: document.getElementById('review-list'),
        finalScoreText: document.getElementById('final-score-text')
    };

    function init() {
        buildNavGrid();
        loadQuestion(0);
        startTimer();
    }

    function buildNavGrid() {
        UI.navGrid.innerHTML = '';
        for (let i = 0; i < questions.length; i++) {
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            btn.innerText = i + 1;
            btn.onclick = () => jumpToQuestion(i);
            UI.navGrid.appendChild(btn);
        }
    }

    function updateNavStyles() {
        const buttons = UI.navGrid.children;
        for (let i = 0; i < questions.length; i++) {
            buttons[i].classList.remove('active');
            if (i === currentIndex) buttons[i].classList.add('active');

            if (userAnswers[i] !== null) {
                if (userAnswers[i] === questions[i].answer) {
                    buttons[i].classList.add('answered-correct');
                } else {
                    buttons[i].classList.add('answered-incorrect');
                }
            }
        }
    }

    function loadQuestion(index) {
        currentIndex = index;
        const qData = questions[index];

        UI.questionText.innerHTML = `Q${index + 1}. ${qData.q}`;
        
        if (qData.snippet) {
            UI.snippet.style.display = 'block';
            UI.snippet.innerText = qData.snippet;
        } else {
            UI.snippet.style.display = 'none';
        }

        UI.optionsContainer.innerHTML = '';
        UI.feedbackBox.style.display = 'none';

        const isAnswered = userAnswers[index] !== null;

        qData.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `${String.fromCharCode(65 + i)}. ${opt}`;
            
            if (isAnswered) {
                btn.disabled = true;
                if (i === qData.answer) btn.classList.add('correct');
                if (i === userAnswers[index] && i !== qData.answer) btn.classList.add('incorrect');
            } else {
                btn.onclick = () => selectOption(i);
            }
            UI.optionsContainer.appendChild(btn);
        });

        if (isAnswered) showFeedback(index);

        UI.btnPrev.disabled = index === 0;
        UI.btnNext.disabled = index === questions.length - 1;
        updateNavStyles();
    }

    function selectOption(selectedIndex) {
        if (userAnswers[currentIndex] !== null) return; // Prevent multiple clicks

        const qData = questions[currentIndex];
        userAnswers[currentIndex] = selectedIndex;

        const buttons = UI.optionsContainer.children;
        for (let i = 0; i < buttons.length; i++) {
            buttons[i].disabled = true;
            if (i === qData.answer) buttons[i].classList.add('correct');
            if (i === selectedIndex && i !== qData.answer) buttons[i].classList.add('incorrect');
        }

        if (selectedIndex === qData.answer) {
            score++;
            UI.scoreDisplay.innerText = `Score: ${score} / 46`;
        }

        showFeedback(currentIndex);
        updateNavStyles();
    }

    function showFeedback(index) {
        const qData = questions[index];
        const userChoice = userAnswers[index];
        
        UI.feedbackBox.style.display = 'block';
        UI.feedbackCorrect.innerHTML = qData.options[qData.answer];
        UI.feedbackTheory.innerHTML = qData.theory;

        if (userChoice === qData.answer) {
            UI.feedbackBox.style.borderLeftColor = 'var(--correct)';
            UI.feedbackStatus.innerText = '✅ Correct!';
            UI.feedbackStatus.style.color = 'var(--correct)';
        } else {
            UI.feedbackBox.style.borderLeftColor = 'var(--incorrect)';
            UI.feedbackStatus.innerText = '❌ Incorrect';
            UI.feedbackStatus.style.color = 'var(--incorrect)';
        }
    }

    function changeQuestion(step) {
        const newIndex = currentIndex + step;
        if (newIndex >= 0 && newIndex < questions.length) {
            loadQuestion(newIndex);
        }
    }

    function jumpToQuestion(index) {
        loadQuestion(index);
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let s = (timeLeft % 60).toString().padStart(2, '0');
            UI.timerDisplay.innerText = `${m}:${s}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endQuiz();
            }
        }, 1000);
    }

    function endQuiz() {
        clearInterval(timerInterval);
        UI.quizContainer.style.display = 'none';
        UI.reviewScreen.style.display = 'block';
        UI.finalScoreText.innerText = `Final Score: ${score} out of 46`;
        buildReviewScreen();
    }

    function buildReviewScreen() {
        UI.reviewList.innerHTML = '';
        questions.forEach((q, i) => {
            const userAns = userAnswers[i];
            const isCorrect = userAns === q.answer;
            
            let statusClass = 'unanswered';
            let statusText = 'Unanswered';
            if (userAns !== null) {
                statusClass = isCorrect ? 'correct' : 'incorrect';
                statusText = isCorrect ? '✅ Correct' : '❌ Incorrect';
            }

            let snippetHtml = q.snippet ? `<div class="snippet" style="margin: 10px 0; font-size: 0.9em;">${q.snippet}</div>` : '';
            let userGivenAnsHtml = userAns !== null ? `<p><strong>Your Answer:</strong> ${q.options[userAns]}</p>` : `<p><strong>Your Answer:</strong> None</p>`;

            const item = document.createElement('div');
            item.className = `review-item ${statusClass}`;
            item.innerHTML = `
                <div style="margin-bottom: 10px;"><strong>Q${i + 1}. ${q.q}</strong></div>
                ${snippetHtml}
                ${userGivenAnsHtml}
                <p><strong>Correct Answer:</strong> ${q.options[q.answer]}</p>
                <div style="background: #f1f5f9; padding: 10px; border-radius: 4px; font-size: 0.9em;">
                    <strong>Theory:</strong> ${q.theory}
                </div>
            `;
            UI.reviewList.appendChild(item);
        });
    }

    window.onload = init;
</script>
