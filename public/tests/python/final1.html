<script>
const questions = [
{
    q: "What will be the output of the following tuple swapping code?",

t1 = (11, 22)
t2 = (99, 88)

t1, t2 = t2, t1

print(t1[0])
    `,
    options: ["11", "22", "99", "88"],
    answer: 2,

        q: "How does inheriting from a class without `__slots__` affect a child class that defines `__slots__`?",

    },
    {

        answer: 1,
        theory: "The GIL (Global Interpreter Lock) prevents multiple native threads from executing Python bytecodes at once in CPython. This makes threading unsuitable for CPU-bound tasks, though it remains effective for I/O-bound tasks."
    },

        answer: 1,
        theory: "Default arguments are evaluated exactly once when the function is defined, not every time the function is called. Mutating a default list or dict persists that mutation across subsequent calls."

        answer: 1,
        theory: "When a module is first imported, Python creates an empty module object in `sys.modules` before executing the code. If a circular import happens, the second import finds the partially initialized module in `sys.modules`, preventing an infinite loop (though it may cause an AttributeError if used too early)."
    },
    {
        q: "How does CPython optimize small integer memory allocation?",

    },
    {

    {

        code: "class MyClass:\n    @classmethod\n    def do_work(cls):\n        pass",
        options: ["It passes the instance as the first argument", "It requires no initial argument", "It passes the class itself as the first implicit argument", "It prevents inheritance"],
        answer: 2,
        theory: "`@classmethod` binds the method to the class, passing the class type as the first argument (`cls`), allowing it to instantiate the class or alter class state. `@staticmethod` passes neither the instance nor the class."
    },
    {
        q: "How does Python handle Multiple Inheritance of the same base class at different levels?",
        code: "class A: pass\nclass B(A): pass\nclass C(A): pass\nclass D(B, C): pass",
        options: ["It creates two separate instances of A (like C++)", "It uses MRO (C3 Linearization) to ensure A is initialized exactly once, at the end of the chain", "TypeError is thrown", "It ignores C's inheritance of A"],
        answer: 1,
        theory: "Unlike C++ which requires virtual inheritance to avoid the diamond problem, Python's C3 Linearization mathematically flattens the hierarchy, ensuring every base class is visited exactly once in a predictable order."
    }
];

let currentQuestionIndex = 0;
let score = 0;
let userAnswers = new Array(questions.length).fill(null);
let timerLeft = 3600; // 60 minutes in seconds
let timerInterval;

const elements = {
    timer: document.getElementById('timer'),
    quizScreen: document.getElementById('quiz-screen'),
    resultScreen: document.getElementById('result-screen'),
    progressText: document.getElementById('progress-text'),
    questionText: document.getElementById('question-text'),
    snippetContainer: document.getElementById('code-snippet-container'),
    snippetCode: document.getElementById('code-snippet'),
    optionsContainer: document.getElementById('options-container'),
    nextBtn: document.getElementById('next-btn'),
    scoreDisplay: document.getElementById('score-display'),
    reviewContainer: document.getElementById('review-container')
};

function startTimer() {
    timerInterval = setInterval(() => {
        timerLeft--;
        updateTimerDisplay();
        
        if (timerLeft <= 0) {
            clearInterval(timerInterval);
            finishQuiz();
        }
    }, 1000);
}

function updateTimerDisplay() {
    const minutes = Math.floor(timerLeft / 60);
    const seconds = timerLeft % 60;
    elements.timer.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    
    if (timerLeft < 300) { // Under 5 minutes
        elements.timer.classList.add('warning');
    }
}

function loadQuestion() {
    const q = questions[currentQuestionIndex];
    elements.progressText.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
    elements.questionText.textContent = q.q;
    
    if (q.code) {
        elements.snippetContainer.style.display = 'block';
        elements.snippetCode.textContent = q.code;
    } else {
        elements.snippetContainer.style.display = 'none';
    }

    elements.optionsContainer.innerHTML = '';
    q.options.forEach((opt, index) => {
        const label = document.createElement('label');
        label.className = 'option-label';
        
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'option';
        input.value = index;
        
        if (userAnswers[currentQuestionIndex] === index) {
            input.checked = true;
        }

        input.onchange = () => { elements.nextBtn.disabled = false; };
        
        label.appendChild(input);
        label.appendChild(document.createTextNode(opt));
        elements.optionsContainer.appendChild(label);
    });

    elements.nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 'Submit Assessment' : 'Next Question';
    elements.nextBtn.disabled = userAnswers[currentQuestionIndex] === null;
}

function handleNext() {
    const selected = document.querySelector('input[name="option"]:checked');
    if (selected) {
        userAnswers[currentQuestionIndex] = parseInt(selected.value);
    }

    if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        loadQuestion();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {
    clearInterval(timerInterval);
    elements.quizScreen.style.display = 'none';
    elements.resultScreen.style.display = 'block';
    
    score = userAnswers.reduce((total, answer, index) => {
        return total + (answer === questions[index].answer ? 1 : 0);
    }, 0);

    elements.scoreDisplay.textContent = `${score} / ${questions.length}`;
    elements.timer.style.display = 'none';

    renderReview();
}

function renderReview() {
    elements.reviewContainer.innerHTML = '';
    
    questions.forEach((q, i) => {
        const userAnswer = userAnswers[i];
        const isCorrect = userAnswer === q.answer;
        
        const reviewEl = document.createElement('div');
        reviewEl.className = `review-item ${isCorrect ? 'correct' : ''}`;
        
        const statusBadge = `<span class="status-badge ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? 'Correct' : 'Incorrect'}</span>`;
        
        let html = `
            ${statusBadge}
            <div class="question-text">${i + 1}. ${q.q}</div>
        `;
        
        if (q.code) {
            html += `<pre><code>${q.code}</code></pre>`;
        }

        html += `
            <div style="margin-bottom: 0.5rem"><strong>Your Answer:</strong> ${userAnswer !== null ? q.options[userAnswer] : '<em>Unanswered</em>'}</div>
            <div style="margin-bottom: 0.5rem; color: var(--accent);"><strong>Correct Answer:</strong> ${q.options[q.answer]}</div>
            <div class="theory-box"><strong>Theory & Architecture:</strong> ${q.theory}</div>
        `;
        
        reviewEl.innerHTML = html;
        elements.reviewContainer.appendChild(reviewEl);
    });
}

// Initialize
startTimer();
loadQuestion();

</script>
</body>
</html>
