<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Python for AI - MCQ Test</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --background-color: #ecf0f1;
            --text-color: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 800px;
            max-width: 95%;
            padding: 30px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--background-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .timer {
            font-size: 1.2rem;
            font-weight: bold;
            color: #e74c3c;
            background: #fadbd8;
            padding: 5px 15px;
            border-radius: 5px;
        }
        .question-counter {
            font-size: 1.1rem;
            color: var(--primary-color);
            font-weight: 600;
        }
        .question-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        pre {
            background-color: #f4f4f4;
            padding: 15px;
            border-left: 4px solid var(--secondary-color);
            border-radius: 4px;
            overflow-x: auto;
            font-size: 1rem;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .option-label {
            background-color: var(--background-color);
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
        }
        .option-label:hover {
            background-color: #d5dbdb;
        }
        .option-label input {
            margin-right: 15px;
            cursor: pointer;
        }
        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            float: right;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .result-container {
            text-align: center;
        }
        .score-text {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
        }
        .clear {
            clear: both;
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-container">
    <div class="header" id="header">
        <div class="question-counter" id="question-counter">Question 1 of 40</div>
        <div class="timer" id="timer">60:00</div>
    </div>
    
    <div id="question-area">
        <div class="question-text" id="question-text">Loading question...</div>
        <div class="options-container" id="options-container"></div>
        <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>Next</button>
        <div class="clear"></div>
    </div>
</div>

<script>
    const questions = [
        // Basics & Control Flow
        {
            q: "What is the output of the following code snippet?\n<pre>for i in range(3):\n    pass\nelse:\n    print('Done')</pre>",
            options: ["SyntaxError", "'Done'", "No output", "Infinite loop"],
            ans: 1
        },
        {
            q: "Which statement is true regarding the 'break' and 'continue' keywords inside nested loops?",
            options: ["'break' exits all nested loops entirely.", "'continue' skips to the next iteration of the outermost loop.", "'break' terminates only the innermost loop currently executing.", "They cannot be used inside while loops."],
            ans: 2
        },
        // Strings & Tuples
        {
            q: "If `s = 'Python'`, what is the output of `s[::-2]`?",
            options: ["'nhy'", "'nohtyP'", "'pto'", "'nto'"],
            ans: 0
        },
        {
            q: "Which of the following creates a tuple containing a single element?",
            options: ["t = (1)", "t = tuple(1)", "t = (1,)", "t = [1,]"],
            ans: 2
        },
        {
            q: "What will be the output?\n<pre>t1 = (11, 22)\nt2 = (99, 88)\nt1, t2 = t2, t1\nprint(t1[0])</pre>",
            options: ["11", "22", "99", "88"],
            ans: 2
        },
        // Dictionaries
        {
            q: "Consider a dictionary used for ROT-13 encryption. What happens if you try to access a key that doesn't exist using the `d.get(key, 'default')` method?",
            options: ["It raises a KeyError", "It returns None", "It returns 'default'", "It adds the key to the dictionary"],
            ans: 2
        },
        {
            q: "What is the output of the following snippet?\n<pre>d = {'a': 1, 'b': 2}\nd.update({'b': 3, 'c': 4})\nprint(len(d))</pre>",
            options: ["2", "3", "4", "TypeError"],
            ans: 1
        },
        {
            q: "Which method is used to remove all items from a dictionary?",
            options: ["delete()", "clear()", "remove()", "popall()"],
            ans: 1
        },
        // Lists
        {
            q: "What is the output of the following list operation?\n<pre>lst = [100, 200, 300]\nlst.extend([400])\nprint(lst)</pre>",
            options: ["[100, 200, 300, [400]]", "[100, 200, 300, 400]", "[400, 100, 200, 300]", "TypeError"],
            ans: 1
        },
        {
            q: "Given `lst = [1, 2, 3]`. What does `lst * 2` result in?",
            options: ["[2, 4, 6]", "[1, 2, 3, 1, 2, 3]", "[[1, 2, 3], [1, 2, 3]]", "Raises ValueError"],
            ans: 1
        },
        {
            q: "Identify the output:\n<pre>def append_list(val, lst=[]):\n    lst.append(val)\n    return lst\nprint(append_list(1))\nprint(append_list(2))</pre>",
            options: ["[1] then [2]", "[1] then [1, 2]", "Error", "[1, 2] then [1, 2]"],
            ans: 1
        },
        // Functions & Regex
        {
            q: "Which function is best suited to check if a sentence contains all letters of the English alphabet (a pangram)?",
            options: ["string.isalpha()", "set(string.ascii_lowercase).issubset(set(text.lower()))", "text.contains(string.ascii_lowercase)", "re.match('[a-z]*', text)"],
            ans: 1
        },
        {
            q: "What is the output of the following lambda function usage?\n<pre>f = lambda x, y=2: x * y\nprint(f(3))</pre>",
            options: ["3", "6", "9", "SyntaxError"],
            ans: 1
        },
        {
            q: "In regular expressions, what does `re.findall(r'\\b\\w{3}\\b', 'The cat sat on the mat')` return?",
            options: ["['The', 'cat', 'sat', 'the', 'mat']", "['The', 'cat', 'sat', 'on', 'the', 'mat']", "['cat', 'sat', 'the', 'mat']", "['The', 'cat', 'sat']"],
            ans: 0
        },
        {
            q: "How do you define a function that takes an arbitrary number of keyword arguments?",
            options: ["def func(*args):", "def func(**kwargs):", "def func(kwargs):", "def func(args=None):"],
            ans: 1
        },
        {
            q: "What is the purpose of the `dir()` built-in function in Python?",
            options: ["Creates a new directory in the file system", "Deletes a variable from memory", "Returns a list of valid attributes of the object", "Returns the memory address of an object"],
            ans: 2
        },
        // Object-Oriented Programming (OOP)
        {
            q: "In an OOP scenario involving Employee classes, what is the correct way to inherit from a `Person` class?",
            options: ["class Employee extends Person:", "class Employee(Person):", "class Employee inherits Person:", "class Employee: Person"],
            ans: 1
        },
        {
            q: "What happens if a child class defines a method with the same name as a method in the parent class?",
            options: ["The code throws a SyntaxError.", "The parent class method cannot be accessed anymore.", "The child class method overrides the parent class method.", "Python natively supports method overloading based on signatures."],
            ans: 2
        },
        {
            q: "What does data hiding (encapsulation) in Python typically entail?",
            options: ["Using the 'private' keyword before variable declarations.", "Prefixing variable names with double underscores (__).", "Saving variables in a separate locked module.", "Declaring variables inside a try-catch block."],
            ans: 1
        },
        {
            q: "What is the output of this code?\n<pre>class A:\n    def __init__(self):\n        self.x = 1\n\nclass B(A):\n    def __init__(self):\n        super().__init__()\n        self.y = 2\n\nb = B()\nprint(b.x, b.y)</pre>",
            options: ["1 2", "AttributeError: 'B' has no attribute 'x'", "None 2", "2 1"],
            ans: 0
        },
        {
            q: "Which decorator is used to define a method that operates on the class rather than instances?",
            options: ["@staticmethod", "@classmethod", "@abstractmethod", "@property"],
            ans: 1
        },
        // Exception Handling
        {
            q: "What is the output of the following snippet?\n<pre>def test():\n    try:\n        return 1\n    finally:\n        return 2\n\nprint(test())</pre>",
            options: ["1", "2", "Error", "None"],
            ans: 1
        },
        {
            q: "When does the `else` block in a `try-except` statement execute?",
            options: ["Always, regardless of exceptions.", "Only when an exception is raised.", "Only when no exceptions are raised in the try block.", "When the finally block finishes."],
            ans: 2
        },
        {
            q: "Which exception is raised when converting the string 'abc' to an integer using `int('abc')`?",
            options: ["TypeError", "NameError", "KeyError", "ValueError"],
            ans: 3
        },
        // Numpy & Scipy
        {
            q: "Which NumPy operation represents element-wise multiplication of two arrays `A` and `B`?",
            options: ["A @ B", "np.dot(A, B)", "A * B", "A.matmul(B)"],
            ans: 2
        },
        {
            q: "What is the correct way to find the exponential of all elements in a NumPy array `arr`?",
            options: ["math.exp(arr)", "np.exp(arr)", "arr.exp()", "np.exponential(arr)"],
            ans: 1
        },
        {
            q: "If an array has shape (5,), what is its dimensionality?",
            options: ["0-D (Scalar)", "1-D (Vector)", "2-D (Matrix)", "5-D"],
            ans: 1
        },
        // Pandas
        {
            q: "In Pandas, what parameter is used in `pd.read_table()` to specify that the dataset does not have column names in the first row?",
            options: ["names=False", "header=None", "index_col=0", "skiprows=1"],
            ans: 1
        },
        {
            q: "To concatenate a 'Gender' and 'Age' column into a new column, which syntax is valid?",
            options: ["df['New'] = df['Age'].astype(str) + df['Gender']", "df['New'] = df['Age'] & df['Gender']", "df['New'] = pd.concat([df['Age'], df['Gender']])", "df.merge('Age', 'Gender')"],
            ans: 0
        },
        {
            q: "If you want to find average views grouped by age in Pandas, which command is correct?",
            options: ["df.groupby('age')['views'].mean()", "df.mean('views').groupby('age')", "df.aggregate('mean', 'age')", "df['views'].average(group='age')"],
            ans: 0
        },
        // Matplotlib & Data Viz
        {
            q: "In Matplotlib, how do you plot a pie chart to compare sales?",
            options: ["plt.pie(sales_data)", "plt.chart('pie', sales_data)", "plt.plot(type='pie')", "plt.circle(sales_data)"],
            ans: 0
        },
        {
            q: "Which statement best describes Seaborn compared to Matplotlib?",
            options: ["Seaborn is exclusively for 3D graphs.", "Seaborn provides a high-level interface for drawing attractive statistical graphics.", "Seaborn replaces Pandas for data wrangling.", "Seaborn does not support DataFrames."],
            ans: 1
        },
        {
            q: "If you want to compare multiple products' sales across a single year using bars stacked on top of each other, which plot is appropriate?",
            options: ["Scatter plot", "Histogram", "Stacked Bar Chart", "Box Plot"],
            ans: 2
        },
        // Databases in Python
        {
            q: "Which method is used to fetch all rows resulting from a database query in `sqlite3`?",
            options: ["cursor.getall()", "cursor.fetchall()", "cursor.read()", "cursor.fetchrows()"],
            ans: 1
        },
        {
            q: "To safely execute a SQL query with user input to prevent SQL injection, you should use:",
            options: ["String formatting (f-strings)", "Parameterized queries (e.g., cursor.execute('...?', (val,)))", "String concatenation", "str.replace() on the query string"],
            ans: 1
        },
        // Web Frameworks & Scraping
        {
            q: "In Flask, which decorator is used to map a URL to a Python function?",
            options: ["@app.url()", "@app.route()", "@url_map()", "@route.app()"],
            ans: 1
        },
        {
            q: "Which of the following describes the core architecture pattern of Django?",
            options: ["MVC (Model-View-Controller)", "MVT (Model-View-Template)", "MVVM (Model-View-ViewModel)", "Flux architecture"],
            ans: 1
        },
        {
            q: "What is Scrapy primarily used for?",
            options: ["Creating machine learning pipelines", "Automated web scraping and web crawling", "Running a web server", "Rendering client-side JavaScript"],
            ans: 1
        },
        {
            q: "In `urllib` or `requests`, a successful HTTP GET response typically has what status code?",
            options: ["404", "500", "200", "302"],
            ans: 2
        },
        {
            q: "What is the primary difference between a lightweight API framework (Flask) and a full-stack framework (Django)?",
            options: ["Flask includes an ORM by default; Django does not.", "Flask is synchronous only; Django is purely asynchronous.", "Django provides built-in admin, ORM, and auth; Flask requires external libraries for these.", "Flask cannot serve HTML templates."],
            ans: 2
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let timeRemaining = 3600; // 60 minutes in seconds
    let timerInterval;

    const questionCounterEl = document.getElementById('question-counter');
    const timerEl = document.getElementById('timer');
    const questionTextEl = document.getElementById('question-text');
    const optionsContainerEl = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const quizContainer = document.getElementById('quiz-container');

    function initQuiz() {
        renderQuestion();
        startTimer();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeRemaining--;
            let minutes = Math.floor(timeRemaining / 60);
            let seconds = timeRemaining % 60;
            
            if(minutes < 10) minutes = "0" + minutes;
            if(seconds < 10) seconds = "0" + seconds;
            
            timerEl.textContent = `${minutes}:${seconds}`;

            if(timeRemaining <= 0) {
                clearInterval(timerInterval);
                showResults();
            }
        }, 1000);
    }

    function renderQuestion() {
        const currentQ = questions[currentQuestionIndex];
        questionCounterEl.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
        questionTextEl.innerHTML = currentQ.q;
        optionsContainerEl.innerHTML = '';

        currentQ.options.forEach((option, index) => {
            const label = document.createElement('label');
            label.className = 'option-label';
            label.innerHTML = `
                <input type="radio" name="option" value="${index}" onchange="enableNext()">
                ${option}
            `;
            optionsContainerEl.appendChild(label);
        });

        nextBtn.disabled = true;
        if(currentQuestionIndex === questions.length - 1) {
            nextBtn.textContent = "Submit Test";
        }
    }

    function enableNext() {
        nextBtn.disabled = false;
    }

    function nextQuestion() {
        const selectedOption = document.querySelector('input[name="option"]:checked');
        if (selectedOption) {
            const answerVal = parseInt(selectedOption.value);
            if(answerVal === questions[currentQuestionIndex].ans) {
                score++;
            }
        }

        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            renderQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        const percentage = ((score / questions.length) * 100).toFixed(2);
        let feedback = "";
        
        if(percentage >= 80) feedback = "Excellent! You have a strong grasp of Advanced Python.";
        else if(percentage >= 60) feedback = "Good job! But there's room for revision.";
        else feedback = "You should consider reviewing the syllabus concepts again.";

        quizContainer.innerHTML = `
            <div class="result-container">
                <h2>Test Completed!</h2>
                <div class="score-text">Your Score: ${score} / ${questions.length}</div>
                <p>Percentage: <strong>${percentage}%</strong></p>
                <p>${feedback}</p>
                <button class="btn" style="float: none; margin-top: 20px;" onclick="location.reload()">Restart Quiz</button>
            </div>
        `;
    }

    window.onload = initQuiz;
</script>

</body>
</html>
