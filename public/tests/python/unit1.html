<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Programming Quiz</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background: var(--card-bg);
            max-width: 800px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--bg);
        }

        .timer {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--danger);
            background: #fee2e2;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .question-progress {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-light);
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 1.05rem;
            margin-bottom: 20px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: #f9fafb;
            border-color: #d1d5db;
        }

        .option-label input {
            margin-right: 15px;
            transform: scale(1.2);
        }

        .option-label.selected {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .controls {
            display: flex;
            justify-content: space-between;
        }

        button {
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        #submit-btn {
            background-color: var(--success);
        }

        #submit-btn:hover {
            background-color: #059669;
        }

        .hidden {
            display: none !important;
        }

        /* Review Section Styles */
        .review-item {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fdfdfd;
        }

        .review-item.correct-bg { border-left: 5px solid var(--success); }
        .review-item.wrong-bg { border-left: 5px solid var(--danger); }

        .theory-box {
            margin-top: 15px;
            padding: 15px;
            background: #e0f2fe;
            color: #0369a1;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        #score-display {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-screen">
        <div class="header">
            <div class="question-progress" id="progress">Question 1 / 20</div>
            <div class="timer" id="timer">30:00</div>
        </div>

        <div id="question-container">
            </div>

        <div class="controls">
            <button id="prev-btn" onclick="prevQuestion()">Previous</button>
            <button id="next-btn" onclick="nextQuestion()">Next</button>
            <button id="submit-btn" class="hidden" onclick="submitQuiz()">Submit Quiz</button>
        </div>
    </div>

    <div class="quiz-container hidden" id="result-screen">
        <div id="score-display"></div>
        <h2>Detailed Review & Theory</h2>
        <div id="review-container">
            </div>
    </div>

    <script>
        const questions = [
            {
                q: "What is the output of the following string operation?",
                snippet: 'print("a" + "bc" * 2)',
                options: ["abcbc", "abccbc", "a bc bc", "TypeError"],
                correct: 0,
                theory: "String replication (*) has higher precedence than concatenation (+). 'bc' * 2 evaluates to 'bcbc', which is then concatenated with 'a' to form 'abcbc'."
            },
            {
                q: "Analyze the behavior of mutable data types assigned to multiple variables:",
                snippet: 'x = [1, 2]\ny = x\ny.append(3)\nprint(x)',
                options: ["[1, 2]", "[1, 2, 3]", "[3]", "TypeError"],
                correct: 1,
                theory: "Lists are mutable. Assigning `y = x` does not create a copy; both variables point to the same list object in memory. Modifying `y` also modifies `x`."
            },
            {
                q: "What is the result of chained exponentiation?",
                snippet: 'print(2 ** 3 ** 2)',
                options: ["64", "512", "72", "SyntaxError"],
                correct: 1,
                theory: "Exponentiation (**) is right-associative. The expression evaluates from right to left: 3 ** 2 is 9, and then 2 ** 9 is 512."
            },
            {
                q: "What does this string slicing operation yield?",
                snippet: 's = "Python"\nprint(s[::-2])',
                options: ["nohtyP", "nhy", "pto", "TypeError"],
                correct: 1,
                theory: "A step of -2 means the string is traversed backwards, taking every second character. 'P(y)t(h)o(n)' backwards skipping one yields 'n', 'h', 'y'."
            },
            {
                q: "Evaluate the boolean coercion of empty string and float zero:",
                snippet: 'print(bool(0.0) == bool(""))',
                options: ["True", "False", "TypeError", "ValueError"],
                correct: 0,
                theory: "Both 0.0 (float zero) and \"\" (empty string) are considered 'falsy' in Python. Therefore, bool(0.0) is False and bool(\"\") is False. False == False evaluates to True."
            },
            {
                q: "Calculate the result of the bitwise OR operator:",
                snippet: 'print(5 | 3)',
                options: ["8", "1", "7", "15"],
                correct: 2,
                theory: "Bitwise OR operates on binary representations. 5 is 101, and 3 is 011. 101 OR 011 results in 111, which is 7 in decimal."
            },
            {
                q: "What is the exact output of this I/O function call?",
                snippet: 'print("A", "B", sep="-", end="!")',
                options: ["A B-!", "A-B!", "A-B\\n!", "AB-!"],
                correct: 1,
                theory: "The `sep` argument defines the separator between multiple objects ('-'), and the `end` argument overrides the default newline with '!'. Output: A-B!"
            },
            {
                q: "Determine the output after this multiple variable assignment (tuple unpacking):",
                snippet: 'a, b = 1, 2\na, b = b, a + b\nprint(a, b)',
                options: ["1, 3", "2, 3", "2, 4", "SyntaxError"],
                correct: 1,
                theory: "Tuple unpacking evaluates the right side completely before assigning to the left side. `b` is 2, `a+b` is 3. So `a` becomes 2, and `b` becomes 3."
            },
            {
                q: "How does floor division handle negative integers?",
                snippet: 'print(-7 // 3)',
                options: ["-2", "-2.33", "-3", "2"],
                correct: 2,
                theory: "Floor division (//) rounds the result down to the nearest whole integer (towards negative infinity). -7 / 3 is -2.33, so rounding down gives -3."
            },
            {
                q: "What is the length of this set?",
                snippet: 's = {1, 2, 2, 3, "3"}\nprint(len(s))',
                options: ["3", "4", "5", "TypeError"],
                correct: 1,
                theory: "Sets automatically remove duplicate values. The integers `2` and `2` become one item. However, the integer `3` and the string `\"3\"` are different data types, so both are kept. Final set: {1, 2, 3, '3'} (length 4)."
            },
            {
                q: "Identify the output of this logical operation chaining:",
                snippet: 'print(0 or [] or "Hello" or True)',
                options: ["0", "[]", "Hello", "True"],
                correct: 2,
                theory: "The `or` operator returns the first 'truthy' value it encounters. 0 and [] are falsy. 'Hello' is a non-empty string, so it is truthy. The evaluation stops there and returns 'Hello'."
            },
            {
                q: "Evaluate the identity operator (`is`) on empty lists:",
                snippet: 'a = []\nb = []\nprint(a is b)',
                options: ["True", "False", "Error", "None"],
                correct: 1,
                theory: "The `is` operator checks for memory identity, not value equality. Even though both are empty lists, they are created as two distinct objects in memory."
            },
            {
                q: "What is the output of the raw string literal?",
                snippet: 'print(r"C:\\new\\text")',
                options: ["C:\new\text (with actual newline and tab)", "C:\\new\\text", "C:\\new\\text (with escaped slashes)", "SyntaxError"],
                correct: 1,
                theory: "The `r` prefix denotes a raw string, which tells the interpreter to treat backslashes as literal characters rather than escape characters (like \\n or \\t)."
            },
            {
                q: "What happens when a string is passed to list.extend()?",
                snippet: 'x = [1]\nx.extend("ab")\nprint(x)',
                options: ["[1, 'ab']", "[1, 'a', 'b']", "['ab', 1]", "TypeError"],
                correct: 1,
                theory: "The `extend()` method iterates over the provided iterable. Since a string is iterable, it adds each character ('a', 'b') as separate elements to the list."
            },
            {
                q: "Calculate the result of the bitwise left shift:",
                snippet: 'print(4 << 2)',
                options: ["8", "16", "1", "6"],
                correct: 1,
                theory: "A left shift (`<<`) by `n` bits is equivalent to multiplying the number by 2^n. 4 * (2^2) = 4 * 4 = 16. In binary: 100 becomes 10000."
            },
            {
                q: "What happens when you try to reassign a character in a string?",
                snippet: 's = "cat"\ns[0] = "b"\nprint(s)',
                options: ["bat", "cat", "b", "TypeError"],
                correct: 3,
                theory: "Strings in Python are immutable data types. You cannot change, add, or delete individual characters within an existing string object."
            },
            {
                q: "Analyze variable chaining and arithmetic:",
                snippet: 'x = y = z = 5\nx += 1\nprint(y)',
                options: ["5", "6", "None", "Error"],
                correct: 0,
                theory: "Integers are immutable. While x, y, and z initially point to the same integer object (5), `x += 1` creates a new object (6) and binds `x` to it. `y` still points to 5."
            },
            {
                q: "What is the output of f-string floating point formatting?",
                snippet: 'num = 10\nprint(f"{num:.2f}")',
                options: ["10", "10.0", "10.00", "10.00f"],
                correct: 2,
                theory: "The format specifier `:.2f` forces the number to be displayed as a float with exactly two decimal places, turning the integer 10 into the string '10.00'."
            },
            {
                q: "How does the `in` operator handle strings?",
                snippet: 'print("foo" in "foobar" and "baz" not in "foobar")',
                options: ["True", "False", "Error", "None"],
                correct: 0,
                theory: "The `in` operator checks for substrings. 'foo' is inside 'foobar' (True), and 'baz' is not inside 'foobar' (True). True and True evaluates to True."
            },
            {
                q: "What does the `type()` function return for a standalone trailing comma?",
                snippet: 'x = 5,\nprint(type(x))',
                options: ["<class 'int'>", "<class 'tuple'>", "<class 'list'>", "SyntaxError"],
                correct: 1,
                theory: "A trailing comma after an element creates a tuple in Python, even without parentheses. Therefore, `x` is assigned the tuple `(5,)`."
            }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let timeLeft = 30 * 60; // 30 minutes in seconds
        let timerInterval;

        // Elements
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionContainer = document.getElementById('question-container');
        const progressEl = document.getElementById('progress');
        const timerEl = document.getElementById('timer');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz();
                    return;
                }
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if(timeLeft < 300) {
                    timerEl.style.color = 'white';
                    timerEl.style.backgroundColor = 'var(--danger)';
                }
            }, 1000);
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            progressEl.textContent = `Question ${currentQuestionIndex + 1} / ${questions.length}`;
            
            let html = `
                <div class="question-text">${currentQuestionIndex + 1}. ${q.q}</div>
                <pre><code>${q.snippet}</code></pre>
                <div class="options">
            `;

            q.options.forEach((opt, index) => {
                const isSelected = userAnswers[currentQuestionIndex] === index;
                html += `
                    <label class="option-label ${isSelected ? 'selected' : ''}">
                        <input type="radio" name="option" value="${index}" ${isSelected ? 'checked' : ''} onchange="selectOption(${index})">
                        ${opt.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
                    </label>
                `;
            });

            html += `</div>`;
            questionContainer.innerHTML = html;

            // Update button states
            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (currentQuestionIndex === questions.length - 1) {
                nextBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                submitBtn.classList.add('hidden');
            }
        }

        function selectOption(index) {
            userAnswers[currentQuestionIndex] = index;
            const labels = document.querySelectorAll('.option-label');
            labels.forEach(label => label.classList.remove('selected'));
            labels[index].classList.add('selected');
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function submitQuiz() {
            clearInterval(timerInterval);
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            generateReview();
        }

        function generateReview() {
            let score = 0;
            let reviewHtml = '';

            questions.forEach((q, index) => {
                const userAns = userAnswers[index];
                const isCorrect = userAns === q.correct;
                if (isCorrect) score++;

                const statusClass = isCorrect ? 'correct-bg' : 'wrong-bg';
                const userAnsText = userAns !== null ? q.options[userAns].replace(/</g, "&lt;").replace(/>/g, "&gt;") : "<em>Unanswered</em>";
                const correctAnsText = q.options[q.correct].replace(/</g, "&lt;").replace(/>/g, "&gt;");

                reviewHtml += `
                    <div class="review-item ${statusClass}">
                        <strong>Q${index + 1}: ${q.q}</strong>
                        <pre><code>${q.snippet}</code></pre>
                        <p><strong>Your Answer:</strong> <span style="color: ${isCorrect ? 'var(--success)' : 'var(--danger)'}">${userAnsText}</span></p>
                        ${!isCorrect ? `<p><strong>Correct Answer:</strong> <span style="color: var(--success)">${correctAnsText}</span></p>` : ''}
                        <div class="theory-box">
                            <strong>Theory / Explanation:</strong><br>
                            ${q.theory}
                        </div>
                    </div>
                `;
            });

            const scorePercentage = (score / questions.length) * 100;
            document.getElementById('score-display').innerHTML = `
                Your Score: ${score} / ${questions.length} <br>
                <span style="font-size: 1.2rem; color: var(--text-light)">(${scorePercentage}%)</span>
            `;
            document.getElementById('review-container').innerHTML = reviewHtml;
        }

        // Initialize
        loadQuestion();
        startTimer();
    </script>
</body>
</html>
