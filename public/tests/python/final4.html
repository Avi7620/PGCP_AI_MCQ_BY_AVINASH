<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Python PGCP-AI Assessment</title>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; }
        
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        
        header { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 1rem 2rem; border-radius: 12px; margin-bottom: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); border-bottom: 3px solid var(--primary); }
        
        h1 { font-size: 1.25rem; font-weight: 600; }
        .subtitle { font-size: 0.875rem; color: var(--text-muted); }
        
        .timer { font-size: 1.5rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
        .timer.warning { color: var(--danger); }

        .card { background: var(--surface); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); margin-bottom: 2rem; }
        
        .progress-text { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem; display: block; }
        
        .question-text { font-size: 1.125rem; font-weight: 500; margin-bottom: 1.5rem; }
        
        pre { background: #0b1120; padding: 1rem; border-radius: 8px; overflow-x: auto; margin-bottom: 1.5rem; border: 1px solid #334155; }
        code { font-family: 'Fira Code', 'Courier New', monospace; font-size: 0.9rem; color: #e2e8f0; }

        .options-grid { display: grid; gap: 1rem; margin-bottom: 2rem; }
        
        .option-label { display: flex; align-items: flex-start; padding: 1rem; background: rgba(245, 158, 11, 0.05); border: 1px solid #334155; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
        .option-label:hover { border-color: var(--primary); background: rgba(245, 158, 11, 0.1); }
        
        input[type="radio"] { margin-right: 1rem; margin-top: 0.25rem; transform: scale(1.2); accent-color: var(--primary); flex-shrink: 0; }

        .btn { background: var(--primary); color: #0f172a; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; display: inline-flex; align-items: center; justify-content: center; width: 100%; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }

        #result-screen { display: none; }
        .score-display { text-align: center; font-size: 3rem; font-weight: bold; color: var(--accent); margin: 2rem 0; }
        
        .review-item { background: var(--surface); padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; border-left: 4px solid var(--danger); }
        .review-item.correct { border-left-color: var(--accent); }
        .theory-box { background: #0b1120; padding: 1rem; border-radius: 8px; margin-top: 1rem; font-size: 0.9rem; border-left: 3px solid var(--primary); color: #cbd5e1;}
        .status-badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: bold; margin-bottom: 0.5rem; }
        .status-badge.correct { background: #05966933; color: #10b981; }
        .status-badge.incorrect { background: #e11d4833; color: #ef4444; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Advanced Programming using Python</h1>
            <div class="subtitle">PGCP-AI February 2026 Assessment [cite: 5, 6]</div>
        </div>
        <div class="timer" id="timer">60:00</div>
    </header>

    <div id="quiz-screen">
        <div class="card">
            <span class="progress-text" id="progress-text">Question 1 of 40</span>
            <div class="question-text" id="question-text"></div>
            <pre id="code-snippet-container" style="display:none;"><code id="code-snippet"></code></pre>
            <div class="options-grid" id="options-container"></div>
            <button class="btn" id="next-btn" onclick="handleNext()">Next Question</button>
        </div>
    </div>

    <div id="result-screen">
        <div class="card">
            <h2>Assessment Complete</h2>
            <div class="score-display" id="score-display">0 / 40</div>
            <p style="text-align: center; margin-bottom: 2rem;">Review your answers below.</p>
            <div id="review-container"></div>
        </div>
    </div>
</div>

let currentQuestionIndex = 0;
let score = 0;
let userAnswers = new Array(questions.length).fill(null);
let timerLeft = 3600; // 60 minutes
let timerInterval;

const elements = {
    timer: document.getElementById('timer'),
    quizScreen: document.getElementById('quiz-screen'),
    resultScreen: document.getElementById('result-screen'),
    progressText: document.getElementById('progress-text'),
    questionText: document.getElementById('question-text'),
    snippetContainer: document.getElementById('code-snippet-container'),
    snippetCode: document.getElementById('code-snippet'),
    optionsContainer: document.getElementById('options-container'),
    nextBtn: document.getElementById('next-btn'),
    scoreDisplay: document.getElementById('score-display'),
    reviewContainer: document.getElementById('review-container')
};

function startTimer() {
    timerInterval = setInterval(() => {
        timerLeft--;
        updateTimerDisplay();
        
        if (timerLeft <= 0) {
            clearInterval(timerInterval);
            finishQuiz();
        }
    }, 1000);
}

function updateTimerDisplay() {
    const minutes = Math.floor(timerLeft / 60);
    const seconds = timerLeft % 60;
    elements.timer.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    
    if (timerLeft < 300) { 
        elements.timer.classList.add('warning');
    }
}

function loadQuestion() {
    const q = questions[currentQuestionIndex];
    elements.progressText.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
    elements.questionText.textContent = q.q;

    if (q.code) {
        elements.snippetContainer.style.display = 'block';
        elements.snippetCode.textContent = q.code;
    } else {
        elements.snippetContainer.style.display = 'none';
    }

    elements.optionsContainer.innerHTML = '';
    q.options.forEach((opt, index) => {
        const label = document.createElement('label');
        label.className = 'option-label';
        
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'option';
        input.value = index;
        
        if (userAnswers[currentQuestionIndex] === index) {
            input.checked = true;
        }

        input.onchange = () => { elements.nextBtn.disabled = false; };
        
        label.appendChild(input);
        
        const span = document.createElement('span');
        span.textContent = opt;
        label.appendChild(span);
        
        elements.optionsContainer.appendChild(label);
    });

    elements.nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 'Submit Assessment' : 'Next Question';
    elements.nextBtn.disabled = userAnswers[currentQuestionIndex] === null;
}

function handleNext() {
    const selected = document.querySelector('input[name="option"]:checked');
    if (selected) {
        userAnswers[currentQuestionIndex] = parseInt(selected.value);
    }

    if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        loadQuestion();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {
    clearInterval(timerInterval);
    elements.quizScreen.style.display = 'none';
    elements.resultScreen.style.display = 'block';
    
    score = userAnswers.reduce((total, answer, index) => {
        return total + (answer === questions[index].answer ? 1 : 0);
    }, 0);

    elements.scoreDisplay.textContent = `${score} / ${questions.length}`;
    elements.timer.style.display = 'none';

    renderReview();
}

function renderReview() {
    elements.reviewContainer.innerHTML = '';
    
    questions.forEach((q, i) => {
        const userAnswer = userAnswers[i];
        const isCorrect = userAnswer === q.answer;
        
        const reviewEl = document.createElement('div');
        reviewEl.className = `review-item ${isCorrect ? 'correct' : ''}`;
        
        const statusBadge = `<span class="status-badge ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? 'Correct' : 'Incorrect'}</span>`;
        
        let html = `
            ${statusBadge}
            <div class="question-text">${i + 1}. ${q.q}</div>
        `;
        
        if (q.code) {
            html += `<pre><code>${q.code}</code></pre>`;
        }

        html += `
            <div style="margin-bottom: 0.5rem"><strong>Your Answer:</strong> ${userAnswer !== null ? q.options[userAnswer] : '<em>Unanswered</em>'}</div>
            <div style="margin-bottom: 0.5rem; color: var(--accent);"><strong>Correct Answer:</strong> ${q.options[q.answer]}</div>
            <div class="theory-box"><strong>Explanation:</strong> ${q.theory}</div>
        `;
        
        reviewEl.innerHTML = html;
        elements.reviewContainer.appendChild(reviewEl);
    });
}

// Initialize
startTimer();
loadQuestion();

</script>
</body>
</html>
