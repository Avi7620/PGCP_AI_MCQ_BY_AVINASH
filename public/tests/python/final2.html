<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Python Programming Assessment</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --accent-hover: #2980b9;
            --bg-color: #ecf0f1;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #7f8c8d;
            --border-color: #bdc3c7;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 850px;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.4rem;
            margin: 0;
            color: var(--primary-color);
        }

        .timer {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--danger-color);
            background: #fadbd8;
            padding: 8px 16px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-text {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        pre {
            background-color: #282c34;
            color: #abb2bf;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            margin-bottom: 20px;
            border: 1px solid #1e2227;
        }

        code {
            font-family: inherit;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            background-color: #fafafa;
        }

        .option:hover {
            background-color: #f1f8ff;
            border-color: #a0cfee;
        }

        .option.selected {
            border-color: var(--accent-color);
            background-color: #ebf5fb;
            box-shadow: 0 0 0 1px var(--accent-color);
        }

        .option input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.3);
            cursor: pointer;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        button:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Results Screen */
        .result-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: #ebf5fb;
            color: var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            margin: 0 auto 25px auto;
            border: 8px solid var(--accent-color);
        }

        .result-message {
            font-size: 1.4rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .result-subtext {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-container">
    <div class="header">
        <h1>PGCP-AI: Python Assessment</h1>
        <div class="timer" id="timer">⏱️ 60:00</div>
    </div>
    
    <div class="progress-text" id="progress-text">Question 1 of 40</div>
    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    
    <div class="question-text" id="question-text">Loading question...</div>
    
    <div class="options-container" id="options-container">
        </div>
    
    <div class="controls">
        <button id="next-btn" onclick="nextQuestion()" disabled>Next Question</button>
    </div>
</div>

<div class="quiz-container result-screen" id="result-screen">
    <div class="score-circle" id="score-display">0/40</div>
    <div class="result-message" id="result-message">Assessment Complete</div>
    <div class="result-subtext" id="result-subtext">Thank you for completing the Advanced Python exam.</div>
    <button onclick="location.reload()">Retake Assessment</button>
</div>

<script>
    const questions = [
        // Flow Control & Basics
        {
            q: `What will be the output of the following code snippet?<br>
<pre><code>for i in range(3):
    pass
else:
    print("Done")</code></pre>`,
            options: ["SyntaxError", "No output", "Done", "0 1 2 Done"],
            answer: 2
        },
        {
            q: `What is the output of the following Python code?<br>
<pre><code>x = ['ab', 'cd']
for i in x:
    x.append(i.upper())
print(x)</code></pre>`,
            options: ["['ab', 'cd', 'AB', 'CD']", "Infinite Loop", "['AB', 'CD']", "TypeError"],
            answer: 1
        },
        {
            q: "Which of the following data types is immutable in Python?",
            options: ["List", "Dictionary", "Set", "Tuple"],
            answer: 3
        },
        {
            q: `What does the following slicing operation return?<br>
<pre><code>s = "Python"
print(s[::-2])</code></pre>`,
            options: ["nohtyP", "nhy", "Pto", "TypeError"],
            answer: 1
        },
        {
            q: `What is the result of this expression?<br>
<pre><code>bool('False') == bool(False)</code></pre>`,
            options: ["True", "False", "TypeError", "ValueError"],
            answer: 1
        },
        // Functions & Lambdas
        {
            q: `Consider the following function definition. What will be printed?<br>
<pre><code>def append_item(item, lst=[]):
    lst.append(item)
    return lst

print(append_item(1))
print(append_item(2))</code></pre>`,
            options: ["[1] then [2]", "[1] then [1, 2]", "TypeError", "[1] then []"],
            answer: 1
        },
        {
            q: "In a Python function definition, what is the correct order of arguments?",
            options: ["Positional, Default, *args, **kwargs", "*args, Positional, Default, **kwargs", "Positional, *args, Default, **kwargs", "Default, Positional, *args, **kwargs"],
            answer: 0
        },
        {
            q: `What is the output of the following lambda function mapping?<br>
<pre><code>funcs = [lambda x: x*i for i in range(3)]
print([f(2) for f in funcs])</code></pre>`,
            options: ["[0, 2, 4]", "[4, 4, 4]", "[0, 0, 0]", "TypeError"],
            answer: 1
        },
        {
            q: "Which built-in function is used to return a list of valid attributes of an object?",
            options: ["type()", "help()", "dir()", "id()"],
            answer: 2
        },
        {
            q: "What happens if a recursive function in Python does not have a base case?",
            options: ["It runs infinitely until RAM is exhausted", "It raises a RecursionError when the maximum recursion depth is exceeded", "The compiler optimizes it into a while loop", "It returns None"],
            answer: 1
        },
        // Dictionaries, Sets & Lists
        {
            q: `What is the output of the following dictionary code?<br>
<pre><code>d = {1: 'a', 2: 'b'}
d.update({2: 'c', 3: 'd'})
print(d)</code></pre>`,
            options: ["{1: 'a', 2: 'b', 3: 'd'}", "{1: 'a', 2: 'c', 3: 'd'}", "KeyError", "{1: 'a', 2: ['b', 'c'], 3: 'd'}"],
            answer: 1
        },
        {
            q: `What does the following list comprehension do?<br>
<pre><code>[x for x in range(10) if x % 2 == 0 if x % 3 == 0]</code></pre>`,
            options: ["Raises a SyntaxError", "Returns numbers divisible by either 2 or 3", "Returns numbers divisible by both 2 and 3", "Returns all even numbers"],
            answer: 2
        },
        {
            q: "Which set operation method returns a set containing elements present in either of the sets, but not in both?",
            options: ["intersection()", "difference()", "symmetric_difference()", "union()"],
            answer: 2
        },
        {
            q: `What is the output of this code?<br>
<pre><code>a = [1, 2, 3]
b = a
b[0] = 99
print(a[0])</code></pre>`,
            options: ["1", "99", "TypeError", "IndexError"],
            answer: 1
        },
        {
            q: "Which string method can be used to split a string into a list of words using a specific delimiter?",
            options: ["partition()", "split()", "join()", "strip()"],
            answer: 1
        },
        // OOP Concepts
        {
            q: "In Python Object-Oriented Programming, what is the primary purpose of the `__init__` method?",
            options: ["To create a new instance of a class", "To initialize the attributes of a newly created object", "To delete an object from memory", "To overload the '+' operator"],
            answer: 1
        },
        {
            q: "How does Python achieve data hiding (private variables) by convention in a class?",
            options: ["Using the 'private' keyword", "Prefixing the attribute name with a double underscore (__)", "Prefixing the attribute name with a single underscore (_)", "Suffixing the attribute with a double underscore"],
            answer: 1
        },
        {
            q: `Consider the following classes. What is printed?<br>
<pre><code>class A:
    def show(self): print("A")
class B(A):
    def show(self): print("B")
class C(B):
    pass
obj = C()
obj.show()</code></pre>`,
            options: ["A", "B", "AttributeError", "C"],
            answer: 1
        },
        {
            q: "What function is used to call a method from a parent class within a child class?",
            options: ["parent()", "base()", "super()", "extend()"],
            answer: 2
        },
        {
            q: "Python does not support method overloading by default. How is dynamic behavior typically achieved instead?",
            options: ["Using multiple classes with the same name", "Using default arguments or *args/**kwargs", "Using the @overload decorator", "Method overloading is strictly impossible in Python"],
            answer: 1
        },
        // Exception Handling & Logging
        {
            q: `What will this code return?<br>
<pre><code>def test():
    try:
        return 1
    finally:
        return 2

print(test())</code></pre>`,
            options: ["1", "2", "Compilation Error", "None"],
            answer: 1
        },
        {
            q: "Which clause is executed ONLY if NO exceptions are raised in the 'try' block?",
            options: ["except", "finally", "else", "catch"],
            answer: 2
        },
        {
            q: "When creating a User-Defined Exception in Python, which class must you inherit from?",
            options: ["Error", "BaseException or Exception", "CustomError", "RuntimeError"],
            answer: 1
        },
        {
            q: "Which logging level represents the highest severity?",
            options: ["WARNING", "ERROR", "CRITICAL", "DEBUG"],
            answer: 2
        },
        {
            q: `How do you catch multiple specific exceptions in a single block?<br>
<pre><code>try:
    # code
...</code></pre>`,
            options: ["except TypeError, ValueError:", "except (TypeError, ValueError):", "except TypeError or ValueError:", "catch (TypeError, ValueError):"],
            answer: 1
        },
        // NumPy & Pandas
        {
            q: "In Pandas, what is the fundamental difference between `loc` and `iloc`?",
            options: ["`loc` is label-based indexing; `iloc` is integer-position-based indexing.", "`loc` is for rows; `iloc` is for columns.", "`loc` modifies the original dataframe; `iloc` returns a copy.", "`loc` cannot handle slicing; `iloc` can."],
            answer: 0
        },
        {
            q: "Which NumPy property returns the dimensions of an array (e.g., (3, 4))?",
            options: ["array.size", "array.ndim", "array.shape", "array.dtype"],
            answer: 2
        },
        {
            q: `What is the output of this Pandas code?<br>
<pre><code>import pandas as pd
s = pd.Series([1, 2, 3], index=['a', 'b', 'c'])
print(s['b'])</code></pre>`,
            options: ["1", "2", "3", "KeyError"],
            answer: 1
        },
        {
            q: "Which Pandas method is used to fill NaN (Not a Number) values in a DataFrame with a specified value?",
            options: ["dropna()", "replace()", "fillna()", "insert()"],
            answer: 2
        },
        {
            q: "In NumPy, what is 'Broadcasting'?",
            options: ["Sending an array to multiple CPU cores", "Casting elements from int to float", "How NumPy treats arrays with different shapes during arithmetic operations", "Exporting arrays to a CSV file"],
            answer: 2
        },
        // Visualization
        {
            q: "Which Python visualization library is specifically built on top of Matplotlib to provide a high-level interface for drawing attractive statistical graphics?",
            options: ["Plotly", "ggplot", "Seaborn", "Bokeh"],
            answer: 2
        },
        {
            q: "If you want to create interactive, web-based charts (like zooming and hovering) directly from Python, which library is best suited?",
            options: ["Matplotlib", "Plotly", "Seaborn", "Pandas Plot"],
            answer: 1
        },
        {
            q: "In Matplotlib, what does the command `plt.subplot(2, 2, 1)` indicate?",
            options: ["A grid of 2 rows, 2 columns, activating the 1st subplot.", "A grid of 2 rows, 1 column, activating the 2nd subplot.", "Plotting 2 lines, 2 markers on 1 axis.", "An error, indices start at 0."],
            answer: 0
        },
        // Databases (Python & SQL)
        {
            q: "When executing SQL queries via Python (e.g., SQLite3), why should you use parameterized queries (placeholders like `?` or `%s`)?",
            options: ["It makes the code run faster", "To prevent SQL Injection attacks", "Because Python strings cannot be concatenated with SQL commands", "It is required to fetch multiple rows"],
            answer: 1
        },
        {
            q: "After executing an INSERT or UPDATE statement via a Python database cursor, which connection method must be called to save the changes to the database?",
            options: ["cursor.execute()", "connection.save()", "connection.commit()", "cursor.fetch()"],
            answer: 2
        },
        {
            q: "What does the `fetchall()` method of a database cursor do?",
            options: ["Returns the first row of a query result as a tuple", "Returns all rows of a query result as a list of tuples", "Retrieves all tables from the database", "Rolls back the last transaction"],
            answer: 1
        },
        // Web Frameworks & Scraping
        {
            q: "Which of the following is a key difference between Django and Flask?",
            options: ["Django is for Machine Learning, Flask is for Web apps.", "Flask is a 'microframework' giving developers flexibility, while Django is a full-stack framework with built-in ORM and admin panel.", "Django only supports Python 2, while Flask supports Python 3.", "Flask enforces the MVC pattern strictly, whereas Django does not."],
            answer: 1
        },
        {
            q: "When scraping websites, what is Scrapy primarily used for compared to libraries like `requests` and `BeautifulSoup`?",
            options: ["Scrapy is only for parsing HTML, not downloading it.", "Scrapy is an asynchronous, full-fledged web spider/crawling framework meant for large-scale data extraction.", "Scrapy is a database meant to store scraped data.", "Scrapy is used to bypass CAPTCHAs automatically."],
            answer: 1
        },
        {
            q: "In the `requests` library, what HTTP status code indicates a successful GET request?",
            options: ["404", "500", "200", "301"],
            answer: 2
        },
        {
            q: `What is the primary purpose of a Session object in the 'requests' library?<br>
<pre><code>import requests
s = requests.Session()</code></pre>`,
            options: ["To download files faster using multi-threading", "To bypass SSL certificate verification globally", "To persist parameters and cookies across multiple requests to the same host", "To establish a WebSocket connection"],
            answer: 2
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let selectedOptionIndex = null;
    let timeLeft = 3600; // 1 Hour in seconds
    let timerInterval;

    // DOM Elements
    const timerDisplay = document.getElementById('timer');
    const progressText = document.getElementById('progress-text');
    const progressBar = document.getElementById('progress-bar');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const quizContainer = document.getElementById('quiz-container');
    const resultScreen = document.getElementById('result-screen');
    const scoreDisplay = document.getElementById('score-display');
    const resultSubtext = document.getElementById('result-subtext');

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `⏱️ ${m}:${s}`;
    }

    function startTimer() {
        timerDisplay.textContent = formatTime(timeLeft);
        timerInterval = setInterval(() => {
            timeLeft--;
            timerDisplay.textContent = formatTime(timeLeft);
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                showResults();
            }
        }, 1000);
    }

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        
        // Reset state
        selectedOptionIndex = null;
        nextBtn.disabled = true;
        optionsContainer.innerHTML = '';
        
        // Update Header & Progress
        progressText.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        progressBar.style.width = `${progressPercent}%`;
        
        // Populate Question
        questionText.innerHTML = `${currentQuestionIndex + 1}. ${q.q}`;
        
        // Populate Options
        q.options.forEach((optText, index) => {
            const label = document.createElement('label');
            label.className = 'option';
            label.innerHTML = `
                <input type="radio" name="answer" value="${index}">
                <span>${optText.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</span>
            `;
            
            // Revert basic HTML escaping for the span if option contained it (optional depending on needs, but safe above)
            
            label.addEventListener('click', () => {
                // Clear previous selection styling
                document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
                // Add selection styling
                label.classList.add('selected');
                label.querySelector('input').checked = true;
                
                selectedOptionIndex = index;
                nextBtn.disabled = false;
            });
            
            optionsContainer.appendChild(label);
        });

        // Change button text on last question
        if (currentQuestionIndex === questions.length - 1) {
            nextBtn.textContent = 'Submit Assessment';
        }
    }

    function nextQuestion() {
        if (selectedOptionIndex === null) return;

        // Check Answer
        if (selectedOptionIndex === questions[currentQuestionIndex].answer) {
            score++;
        }

        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        
        quizContainer.style.display = 'none';
        resultScreen.style.display = 'block';
        
        scoreDisplay.textContent = `${score}/${questions.length}`;
        
        const percentage = (score / questions.length) * 100;
        
        if (percentage >= 80) {
            resultSubtext.textContent = "Excellent job! You have a strong grasp of Advanced Python.";
        } else if (percentage >= 60) {
            resultSubtext.textContent = "Good effort. You passed, but consider reviewing the advanced concepts.";
        } else {
            resultSubtext.textContent = "You might need to study the syllabus more thoroughly. Keep practicing!";
        }
    }

    // Initialization
    window.onload = () => {
        startTimer();
        loadQuestion();
    };

</script>
</body>
</html>
