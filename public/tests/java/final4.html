<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PGCP-AI Java Exam</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.container {
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 120px;
  background: #111827;
  height: 100vh;
  overflow-y: auto;
  padding: 10px;
}

.qno {
  width: 35px;
  height: 35px;
  margin: 5px;
  display: inline-block;
  text-align: center;
  line-height: 35px;
  background: #334155;
  border-radius: 6px;
  cursor: pointer;
}

.qno:hover {
  background: #475569;
}

/* MAIN */
.main {
  flex: 1;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
}

.option {
  background: #334155;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  cursor: pointer;
}

.option:hover {
  background: #475569;
}

button {
  margin: 5px;
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

#timer {
  font-size: 18px;
  margin-bottom: 10px;
}

.correct { background: #16a34a !important; }
.wrong { background: #dc2626 !important; }

</style>
</head>

<body>

<div id="timer">Time: 60:00</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar"></div>

<!-- MAIN -->
<div class="main">

<div class="card">
  <div id="question"></div>
  <div id="options"></div>

  <div>
    <button onclick="prevQ()">Previous</button>
    <button onclick="nextQ()">Next</button>
    <button onclick="submitTest()">Submit</button>
  </div>
</div>

<div id="result"></div>

</div>
</div>

<script>

/* ===================== QUESTIONS ===================== */

const questions = [

{
q:`What is output?
int a = 5;
System.out.println(a++ + ++a);`,
options:["11","12","10","13"],
answer:0
},

{
q:"Which OOP concept is achieved using method overriding?",
options:["Runtime Polymorphism","Compile-time Polymorphism","Encapsulation","Abstraction"],
answer:0
},

{
q:`What is output?
String s1 = "AI";
String s2 = new String("AI");
System.out.println(s1 == s2);`,
options:["true","false","error","null"],
answer:1
},

{
q:"Which keyword prevents inheritance?",
options:["final","static","abstract","this"],
answer:0
},

{
q:`What is output?
System.out.println("Java" + 10 + 20);`,
options:["Java1020","Java30","30Java","Error"],
answer:0
},

{
q:"Which memory stores objects?",
options:["Heap","Stack","Register","Cache"],
answer:0
},

{
q:"Which is immutable?",
options:["String","StringBuilder","ArrayList","HashMap"],
answer:0
},

{
q:"Which is runtime polymorphism?",
options:["Overriding","Overloading","Constructor","Static method"],
answer:0
},

{
q:`What is output?
int x = 10;
System.out.println(x > 5 ? "A" : "B");`,
options:["A","B","Error","10"],
answer:0
},

{
q:`Will finally execute?
try { return 10; } finally { System.out.println("F"); }`,
options:["Yes","No","Only on error","Compile error"],
answer:0
},

{
q:`What is output?
try { System.exit(0); } finally { System.out.println("Hi"); }`,
options:["Hi","Nothing","Error","Exception"],
answer:1
},

{
q:"Which is checked exception?",
options:["IOException","NullPointerException","ArithmeticException","Error"],
answer:0
},

{
q:"Which block ALWAYS executes?",
options:["finally","try","catch","throw"],
answer:0
},

{
q:`What is output?
try { int a=5/0; } catch(Exception e){ System.out.println("E"); }`,
options:["E","0","Exception","Error"],
answer:0
},

{
q:"Which keyword throws exception manually?",
options:["throw","throws","try","catch"],
answer:0
},

{
q:"Which is NOT exception type?",
options:["VirtualException","RuntimeException","IOException","Error"],
answer:0
},

{
q:"Which starts thread?",
options:["start()","run()","execute()","begin()"],
answer:0
},

{
q:"Calling run() directly means?",
options:["No new thread","New thread","Crash","Error"],
answer:0
},

{
q:"Which avoids race condition?",
options:["synchronization","inheritance","overloading","abstraction"],
answer:0
},

{
q:"Thread-safe class?",
options:["Vector","ArrayList","HashMap","StringBuilder"],
answer:0
},

{
q:"Interface supports?",
options:["Multiple inheritance","Single class","No inheritance","Only methods"],
answer:0
},

{
q:"Lambda expression is used for?",
options:["Functional programming","OOP only","JDBC","Memory management"],
answer:0
},

{
q:"Correct lambda syntax?",
options:["x -> x*x","x => x*x","lambda x x*x","function(x)"],
answer:0
},

{
q:`What is output?
System.out.println(10 + 20 + "Java");`,
options:["30Java","Java30","1020Java","Error"],
answer:0
},

{
q:`What is output?
List.of(1,2,3).stream().map(x->x*2).count();`,
options:["3","6","2","0"],
answer:0
}

];

/* ===================== VARIABLES ===================== */

let current = 0;
let answers = new Array(questions.length).fill(null);
let time = 3600;

/* ===================== SIDEBAR ===================== */

const sidebar = document.getElementById("sidebar");

for(let i=0;i<questions.length;i++){
  let div = document.createElement("div");
  div.className = "qno";
  div.innerText = i+1;
  div.onclick = ()=>{ current=i; loadQ(); };
  sidebar.appendChild(div);
}

/* ===================== LOAD QUESTION ===================== */

function loadQ(){
let q = questions[current];

document.getElementById("question").innerHTML =
`<h3>Q${current+1}. ${q.q}</h3>`;

let html = "";
q.options.forEach((o,i)=>{
html += `<div class='option' onclick='select(${i})'>${o}</div>`;
});

document.getElementById("options").innerHTML = html;
}

function select(i){
answers[current] = i;
}

/* ===================== NAVIGATION ===================== */

function nextQ(){
if(current < questions.length-1){
current++;
loadQ();
}
}

function prevQ(){
if(current > 0){
current--;
loadQ();
}
}

/* ===================== SUBMIT ===================== */

function submitTest(){
let score = 0;
let review = "";

questions.forEach((q,i)=>{
let correct = answers[i] === q.answer;
if(correct) score++;

review += `
<div>
<b>Q${i+1}</b>: ${q.q}<br>
Your: ${q.options[answers[i]] || "Not Answered"}<br>
Correct: ${q.options[q.answer]}<br>
<b style="color:${correct?'green':'red'}">
${correct?'Correct':'Wrong'}
</b>
<hr>
</div>`;
});

document.querySelector(".card").style.display="none";

document.getElementById("result").innerHTML =
`<h2>Score: ${score}/${questions.length}</h2><br>${review}`;
}

/* ===================== TIMER ===================== */

setInterval(()=>{
if(time>0){
time--;
let m = Math.floor(time/60);
let s = time%60;
document.getElementById("timer").innerText =
`Time: ${m}:${s}`;
}
},1000);

/* ===================== INIT ===================== */

loadQ();

</script>

</body>
</html>
