            "An ensemble method that averages the structure of multiple decision trees."
        ],
        answer: 1,

    },
    {
        q: "How does L1 Regularization (Lasso) mechanically combat overfitting compared to L2 Regularization (Ridge)?",
        options: [
            "L1 prevents the weights from changing during backpropagation.",
            "L1 applies a spherical constraint that shrinks all weights equally.",
            "L1 applies an absolute value penalty that induces sparsity, forcing the weights of less important features to exactly zero, effectively performing feature selection to reduce model complexity.",
            "L1 increases the bias to exactly zero."

        options: [

        answer: 1,
        theory: "Explicit regularization involves adding a mathematical penalty term (like L1/L2). Implicit regularization occurs naturally due to the algorithm's architecture or optimization dynamics. The noise in SGD helps the model settle into wide, flat minima that generalize better than sharp, overfitted minima."

let currentQuestionIndex = 0;
let score = 0;
let userAnswers = new Array(questions.length).fill(null);
let timerLeft = 3600; 
let timerInterval;

const elements = {
    timer: document.getElementById('timer'),
    quizScreen: document.getElementById('quiz-screen'),
    resultScreen: document.getElementById('result-screen'),
    progressText: document.getElementById('progress-text'),
    questionText: document.getElementById('question-text'),
    optionsContainer: document.getElementById('options-container'),
    nextBtn: document.getElementById('next-btn'),
    scoreDisplay: document.getElementById('score-display'),
    reviewContainer: document.getElementById('review-container')
};

function startTimer() {
    timerInterval = setInterval(() => {
        timerLeft--;
        updateTimerDisplay();
        
        if (timerLeft <= 0) {
            clearInterval(timerInterval);
            finishQuiz();
        }
    }, 1000);
}

function updateTimerDisplay() {
    const minutes = Math.floor(timerLeft / 60);
    const seconds = timerLeft % 60;
    elements.timer.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    
    if (timerLeft < 300) { 
        elements.timer.classList.add('warning');
    }
}

function loadQuestion() {
    const q = questions[currentQuestionIndex];
    elements.progressText.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
    elements.questionText.textContent = q.q;

    elements.optionsContainer.innerHTML = '';
    q.options.forEach((opt, index) => {
        const label = document.createElement('label');
        label.className = 'option-label';
        
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'option';
        input.value = index;
        
        if (userAnswers[currentQuestionIndex] === index) {
            input.checked = true;
        }

        input.onchange = () => { elements.nextBtn.disabled = false; };
        
        label.appendChild(input);
        
        const span = document.createElement('span');
        span.textContent = opt;
        label.appendChild(span);
        
        elements.optionsContainer.appendChild(label);
    });

    elements.nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 'Submit Assessment' : 'Next Question';
    elements.nextBtn.disabled = userAnswers[currentQuestionIndex] === null;
}

function handleNext() {
    const selected = document.querySelector('input[name="option"]:checked');
    if (selected) {
        userAnswers[currentQuestionIndex] = parseInt(selected.value);
    }

    if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        loadQuestion();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {
    clearInterval(timerInterval);
    elements.quizScreen.style.display = 'none';
    elements.resultScreen.style.display = 'block';
    
    score = userAnswers.reduce((total, answer, index) => {
        return total + (answer === questions[index].answer ? 1 : 0);
    }, 0);

    elements.scoreDisplay.textContent = `${score} / ${questions.length}`;
    elements.timer.style.display = 'none';

    renderReview();
}

function renderReview() {
    elements.reviewContainer.innerHTML = '';
    
    questions.forEach((q, i) => {
        const userAnswer = userAnswers[i];
        const isCorrect = userAnswer === q.answer;
        
        const reviewEl = document.createElement('div');
        reviewEl.className = `review-item ${isCorrect ? 'correct' : ''}`;
        
        const statusBadge = `<span class="status-badge ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? 'Correct' : 'Incorrect'}</span>`;
        
        let html = `
            ${statusBadge}
            <div class="question-text">${i + 1}. ${q.q}</div>
            <div style="margin-bottom: 0.5rem"><strong>Your Answer:</strong> ${userAnswer !== null ? q.options[userAnswer] : '<em>Unanswered</em>'}</div>
            <div style="margin-bottom: 0.5rem; color: var(--accent);"><strong>Correct Answer:</strong> ${q.options[q.answer]}</div>
            <div class="theory-box"><strong>Rationale:</strong> ${q.theory}</div>
        `;
        
        reviewEl.innerHTML = html;
        elements.reviewContainer.appendChild(reviewEl);
    });
}

// Initialize
startTimer();
loadQuestion();

</script>
