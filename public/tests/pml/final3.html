        theory: "The Brier Score measures probabilistic calibration. If a model predicts 0.9 probability for a class, but it only belongs to that class 50% of the time, the model is poorly calibrated. Brier Score (acting like MSE for probabilities) detects this."
    },
    {
        q: "In Cohen's Kappa metric for evaluating classification agreement, what exactly is the score correcting for?",
        options: [
            "Data leakage during cross-validation.",
            "The probability of the model guessing the correct class purely by random chance based on the class distribution.",
            "Missing values in the target column.",
            "The latency of the model's predictions."
        ],
        answer: 1,
        theory: "Cohen's Kappa = (Observed Accuracy - Expected Accuracy) / (1 - Expected Accuracy). It explicitly subtracts the accuracy that would be achieved by a model making random guesses weighted by the true class frequencies."
    },
    {
        q: "What is the mathematical consequence of applying 'StandardScaler' (Z-score normalization) to a feature column?",
        options: [
            "It maps all values to a strict range between 0 and 1.",
            "It transforms the feature to have a mean of exactly 0 and a standard deviation of exactly 1.",
            "It guarantees the feature will follow a perfect Gaussian normal distribution.",
            "It removes all extreme outliers from the dataset."
        ],
        answer: 1,
        theory: "Z-score = (x - mean) / std. This simply shifts and scales the data. It does NOT change the underlying shape of the distribution (if it was skewed before, it remains skewed), but it enforces mean=0, std=1."
    },
    {
        q: "In Collaborative Filtering, what is 'Implicit Feedback'?",
        options: [
            "A direct 5-star rating given by a user.",
            "A written text review left on a product page.",
            "Behavioral data inferred from user actions, such as clicks, view time, purchase history, or search queries, where the user does not explicitly rate the item.",
            "The demographic data of the user."
        ],
        answer: 2,
        theory: "Explicit feedback requires conscious effort (ratings). Implicit feedback is gathered passively from interactions. It is far more abundant but harder to interpret, as a 'click' does not definitively prove the user liked the item."

        q: "Why do autoregressive models (like ARMA) struggle inherently with predicting long-term horizons accurately?",
        options: [
            "They run out of memory due to infinite lags.",
            "Because predictions rely on past predictions, causing errors to compound and the forecasts to quickly regress to the mean of the series.",
            "Because the PACF plot loses significance after 1 lag.",
            "They cannot process decimal values."
        ],
        answer: 1,
        theory: "In multi-step forecasting, an AR model must use its prediction for t+1 as the input to predict t+2. Any small error in t+1 is amplified in t+2. After a few steps, the confidence intervals explode and the forecast flatlines at the mean."
    },
    {
        q: "In model evaluation, what is a 'Type II Error'?",
        options: [
            "A False Positive (Rejecting a true null hypothesis).",

            "A True Positive.",
            "A syntax error in the code."

let currentQuestionIndex = 0;
let score = 0;
let userAnswers = new Array(questions.length).fill(null);
let timerLeft = 3600; 
let timerInterval;

const elements = {
    timer: document.getElementById('timer'),
    quizScreen: document.getElementById('quiz-screen'),
    resultScreen: document.getElementById('result-screen'),
    progressText: document.getElementById('progress-text'),
    questionText: document.getElementById('question-text'),
    optionsContainer: document.getElementById('options-container'),
    nextBtn: document.getElementById('next-btn'),
    scoreDisplay: document.getElementById('score-display'),
    reviewContainer: document.getElementById('review-container')
};

function startTimer() {
    timerInterval = setInterval(() => {
        timerLeft--;
        updateTimerDisplay();
        
        if (timerLeft <= 0) {
            clearInterval(timerInterval);
            finishQuiz();
        }
    }, 1000);
}

function updateTimerDisplay() {
    const minutes = Math.floor(timerLeft / 60);
    const seconds = timerLeft % 60;
    elements.timer.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    
    if (timerLeft < 300) { 
        elements.timer.classList.add('warning');
    }
}

function loadQuestion() {
    const q = questions[currentQuestionIndex];
    elements.progressText.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
    elements.questionText.textContent = q.q;

    elements.optionsContainer.innerHTML = '';
    q.options.forEach((opt, index) => {
        const label = document.createElement('label');
        label.className = 'option-label';
        
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'option';
        input.value = index;
        
        if (userAnswers[currentQuestionIndex] === index) {
            input.checked = true;
        }

        input.onchange = () => { elements.nextBtn.disabled = false; };
        
        label.appendChild(input);
        
        const span = document.createElement('span');
        span.textContent = opt;
        label.appendChild(span);
        
        elements.optionsContainer.appendChild(label);
    });

    elements.nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 'Submit Assessment' : 'Next Question';
    elements.nextBtn.disabled = userAnswers[currentQuestionIndex] === null;
}

function handleNext() {
    const selected = document.querySelector('input[name="option"]:checked');
    if (selected) {
        userAnswers[currentQuestionIndex] = parseInt(selected.value);
    }

    if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        loadQuestion();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {
    clearInterval(timerInterval);
    elements.quizScreen.style.display = 'none';
    elements.resultScreen.style.display = 'block';
    
    score = userAnswers.reduce((total, answer, index) => {
        return total + (answer === questions[index].answer ? 1 : 0);
    }, 0);

    elements.scoreDisplay.textContent = `${score} / ${questions.length}`;
    elements.timer.style.display = 'none';

    renderReview();
}

function renderReview() {
    elements.reviewContainer.innerHTML = '';
    
    questions.forEach((q, i) => {
        const userAnswer = userAnswers[i];
        const isCorrect = userAnswer === q.answer;
        
        const reviewEl = document.createElement('div');
        reviewEl.className = `review-item ${isCorrect ? 'correct' : ''}`;
        
        const statusBadge = `<span class="status-badge ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? 'Correct' : 'Incorrect'}</span>`;
        
        let html = `
            ${statusBadge}
            <div class="question-text">${i + 1}. ${q.q}</div>
            <div style="margin-bottom: 0.5rem"><strong>Your Answer:</strong> ${userAnswer !== null ? q.options[userAnswer] : '<em>Unanswered</em>'}</div>
            <div style="margin-bottom: 0.5rem; color: var(--accent);"><strong>Correct Answer:</strong> ${q.options[q.answer]}</div>
            <div class="theory-box"><strong>Rationale:</strong> ${q.theory}</div>
        `;
        
        reviewEl.innerHTML = html;
        elements.reviewContainer.appendChild(reviewEl);
    });
}

// Initialize
startTimer();
loadQuestion();

</script>
</body>
