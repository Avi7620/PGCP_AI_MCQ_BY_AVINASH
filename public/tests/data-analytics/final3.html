            gap: 10px;
        }

            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1em;
            text-align: left;
        }
        .option:hover:not(:disabled) {
            background: #eceff1;
            border-color: #cfd8dc;
        }
        .option:disabled {
            cursor: not-allowed;
        }
        .option.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        .option.wrong {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-left: 5px solid #007bff;
            border-radius: 4px;
            display: none;

            padding-top: 20px;

            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;

            background-color: #0056b3;
        }
        button.nav-btn:disabled {
            background-color: #b0bec5;

        }

            margin-bottom: 20px;

</head>

        renderQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timerSeconds--;
            let m = Math.floor(timerSeconds / 60);
            let s = timerSeconds % 60;
            timerEl.innerText = `Time Left: ${m}:${s < 10 ? '0'+s : s}`;
            
            if (timerSeconds <= 0) {
                clearInterval(timerInterval);
                submitQuiz();
            }
        }, 1000);
    }

    function renderQuestion() {
        const q = questions[currentQuestionIndex];
        qNumEl.innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
        qTextEl.innerText = q.text;

        // Handle Snippet
        if (q.snippet) {
            qSnippetContainer.innerHTML = `<div class="snippet">${escapeHtml(q.snippet)}</div>`;
        } else {
            qSnippetContainer.innerHTML = '';
        }

        // Render Options
        optionsContainer.innerHTML = '';
        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = opt;
            
            // If already answered
            if (userAnswers[currentQuestionIndex] !== null) {
                btn.disabled = true;
                if (index === q.correct) {
                    btn.classList.add('correct');
                } else if (index === userAnswers[currentQuestionIndex]) {
                    btn.classList.add('wrong');
                }
            } else {
                btn.onclick = () => selectOption(index);
            }
            optionsContainer.appendChild(btn);
        });

        // Handle Explanation
        if (userAnswers[currentQuestionIndex] !== null) {
            explanationEl.style.display = 'block';
            explanationEl.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
        } else {
            explanationEl.style.display = 'none';
        }

        // Navigation state
        prevBtn.disabled = currentQuestionIndex === 0;
        
        if (currentQuestionIndex === questions.length - 1) {
            nextBtn.style.display = 'none';
            submitBtn.style.display = 'inline-block';
        } else {
            nextBtn.style.display = 'inline-block';
            submitBtn.style.display = 'none';
        }
    }

    function selectOption(index) {
        if (userAnswers[currentQuestionIndex] !== null) return; // Prevent double clicking

        const q = questions[currentQuestionIndex];
        userAnswers[currentQuestionIndex] = index;

        if (index === q.correct) {
            score++;
        }

        renderQuestion(); // Re-render to show colors and explanation
    }

    function nextQuestion() {
        if (currentQuestionIndex < questions.length - 1) {
            currentQuestionIndex++;
            renderQuestion();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderQuestion();
        }
    }

    function submitQuiz() {
        clearInterval(timerInterval);
        document.getElementById('quiz-container').style.display = 'none';
        reviewContainer.style.display = 'block';
        
        const finalScoreEl = document.getElementById('final-score');
        finalScoreEl.innerText = `You scored ${score} out of ${questions.length} (${((score/questions.length)*100).toFixed(2)}%)`;

        const reviewList = document.getElementById('review-list');
        reviewList.innerHTML = '';

        questions.forEach((q, idx) => {
            const uAns = userAnswers[idx];
            const isCorrect = uAns === q.correct;
            let statusHtml = '';

            if (uAns === null) {
                statusHtml = `<span style="color: #f39c12; font-weight: bold;">Unanswered</span>`;
            } else if (isCorrect) {
                statusHtml = `<span style="color: #28a745; font-weight: bold;">Correct</span>`;
            } else {
                statusHtml = `<span style="color: #dc3545; font-weight: bold;">Incorrect</span>`;
            }

            const revHtml = `
                <div class="review-item" style="border-left: 5px solid ${isCorrect ? '#28a745' : (uAns===null ? '#f39c12' : '#dc3545')}">
                    <p><strong>Q${idx + 1}: ${q.text}</strong></p>
                    ${q.snippet ? `<div class="snippet" style="padding: 10px; font-size: 0.9em;">${escapeHtml(q.snippet)}</div>` : ''}
                    <p>Status: ${statusHtml}</p>
                    <p>Your Answer: <em>${uAns !== null ? q.options[uAns] : 'None'}</em></p>
                    <p>Correct Answer: <em>${q.options[q.correct]}</em></p>
                    <p style="background: #f8f9fa; padding: 10px; border-radius: 4px;"><strong>Explanation:</strong> ${q.explanation}</p>
                </div>
            `;
            reviewList.innerHTML += revHtml;
        });
    }

    function escapeHtml(unsafe) {
        return unsafe
             .replace(/&/g, "&amp;")
             .replace(/</g, "&lt;")
             .replace(/>/g, "&gt;")
             .replace(/"/g, "&quot;")
             .replace(/'/g, "&#039;");
    }

    // Start
    window.onload = initQuiz;
</script>

</body>
</html>
