<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Data Analytics Quiz (PGCP-AI)</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background: var(--card-bg);
            max-width: 900px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 30px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--bg);
        }

        .timer {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text);
            background: #e5e7eb;
            padding: 5px 15px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .timer.urgent {
            color: white;
            background: var(--danger);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .question-progress {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-light);
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 500;
            line-height: 1.5;
        }

        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 1.05rem;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .option-label:hover:not(.disabled) {
            background-color: #f9fafb;
            border-color: #d1d5db;
        }

        .option-label input {
            margin-right: 15px;
            transform: scale(1.2);
            cursor: pointer;
        }

        .option-label.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .option-label.correct {
            border-color: var(--success);
            background-color: var(--success-light);
            color: #065f46;
            font-weight: bold;
        }

        .option-label.wrong {
            border-color: var(--danger);
            background-color: var(--danger-light);
            color: #991b1b;
            font-weight: bold;
        }

        .feedback-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            animation: fadeIn 0.4s;
            margin-bottom: 20px;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box h3 {
            margin-top: 0;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theory-content {
            font-size: 0.95rem;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        button {
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        
        #submit-btn { background-color: var(--warning); color: #000; }
        #submit-btn:hover { background-color: #d97706; color: white;}

        .hidden { display: none !important; }

        /* Review Section */
        #score-display {
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--primary);
        }
        .score-subtitle {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 30px;
        }

        .review-item {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fdfdfd;
        }
        .review-item.correct-bg { border-left: 5px solid var(--success); }
        .review-item.wrong-bg { border-left: 5px solid var(--danger); }
        .review-item.unanswered-bg { border-left: 5px solid var(--warning); }
        
        .review-theory {
            margin-top: 15px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 6px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-screen">
        <div class="header">
            <div class="question-progress" id="progress">Question 1 / 40</div>
            <div class="timer" id="timer">60:00</div>
        </div>

        <div id="question-container"></div>
        <div id="feedback-container" class="feedback-box"></div>

        <div class="controls">
            <button id="prev-btn" onclick="prevQuestion()">Previous</button>
            <button id="next-btn" onclick="nextQuestion()">Next</button>
            <button id="submit-btn" class="hidden" onclick="submitQuiz()">Submit Quiz</button>
        </div>
    </div>

    <div class="quiz-container hidden" id="result-screen">
        <div id="score-display"></div>
        <div class="score-subtitle" id="score-percentage"></div>
        <h2>Detailed Review & Explanations</h2>
        <div id="review-container"></div>
    </div>

    <script>
        const questions = [
            {
                q: "What is the result of using Pandas `merge` with `how='outer'` and `indicator=True`?",
                snippet: "import pandas as pd\ndf1 = pd.DataFrame({'id': [1, 2], 'val_x': ['A', 'B']})\ndf2 = pd.DataFrame({'id': [2, 3], 'val_y': ['C', 'D']})\nres = pd.merge(df1, df2, on='id', how='outer', indicator=True)\nprint(res['_merge'].iloc[0])",
                options: ["left_only", "right_only", "both", "TypeError"],
                correct: 0,
                theory: "The `indicator=True` parameter adds a column `_merge` specifying the source of each row. For `id=1`, it only exists in `df1` (left DataFrame). Thus, the indicator for the first row is 'left_only'. This is a critical step in the Data Preparation lifecycle to identify missing cross-references."
            },
            {
                q: "How does NumPy handle array broadcasting with differing shapes?",
                snippet: "import numpy as np\na = np.ones((3, 1))\nb = np.ones((1, 4))\nprint((a + b).shape)",
                options: ["(3, 1)", "(1, 4)", "(3, 4)", "ValueError"],
                correct: 2,
                theory: "NumPy broadcasts arrays to compatible shapes. The column array `a` (3x1) is replicated 4 times across columns, and the row array `b` (1x4) is replicated 3 times down rows. The resulting shape is the maximum of the dimensions: (3, 4)."
            },
            {
                q: "What does the `stratify` parameter ensure in Sklearn's `train_test_split`?",
                snippet: "from sklearn.model_selection import train_test_split\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, stratify=y)",
                options: [
                    "It splits the data strictly based on temporal order.",
                    "It ensures the train and test sets have the same proportion of class labels as the original dataset.",
                    "It normalizes the features (X) using standard deviation.",
                    "It randomizes the data based on the 'y' array values."
                ],
                correct: 1,
                theory: "Stratification ensures that the distribution of the target variable (`y`) is preserved across both the training and testing sets. This is vital in predictive modeling when dealing with imbalanced classification datasets."
            },
            {
                q: "Identify the correct descriptive statistic output for pandas `describe()` on categorical data:",
                snippet: "import pandas as pd\ns = pd.Series(['apple', 'banana', 'apple', 'orange'])\nprint(s.describe()['top'])",
                options: ["apple", "2", "3", "banana"],
                correct: 0,
                theory: "For object/categorical data, `describe()` returns count, unique, top, and freq. 'top' is the most frequently occurring categorical value (the mode). Since 'apple' appears twice, it is the top value."
            },
            {
                q: "What is the expected behavior of `bfill()` on missing data if the first row is NaN?",
                snippet: "import pandas as pd\nimport numpy as np\ns = pd.Series([np.nan, 2, np.nan, 4])\nprint(s.bfill()[0])",
                options: ["NaN", "2.0", "0.0", "TypeError"],
                correct: 1,
                theory: "Backward fill (`bfill()`) propagates the next valid observation backward to fill gaps. The first valid observation after index 0 is at index 1 (value 2.0). Therefore, the NaN at index 0 becomes 2.0."
            },
            {
                q: "When visualizing two numerical variables with vastly different scales on the same Matplotlib plot, which function is most appropriate?",
                snippet: "fig, ax1 = plt.subplots()\nax2 = _____ # What goes here?\nax1.plot(time, GDP)\nax2.plot(time, population)",
                options: ["ax1.twinx()", "plt.subplot(1, 2, 2)", "ax1.secondary_yaxis()", "ax1.add_axes()"],
                correct: 0,
                theory: "`twinx()` creates a new Axes object with an invisible x-axis and an independent y-axis positioned on the right. This is essential for preventing misleading visualizations when scales differ (e.g., millions vs percentages)."
            },
            {
                q: "Which Seaborn visualization intrinsically combines a boxplot with a Kernel Density Estimation (KDE)?",
                snippet: "import seaborn as sns\n# sns.____(x='day', y='total_bill', data=tips)",
                options: ["boxplot", "stripplot", "violinplot", "swarmplot"],
                correct: 2,
                theory: "A `violinplot` shows the distribution of quantitative data across several levels of one (or more) categorical variables. It features a miniature boxplot inside and a rotated KDE on the outside, providing a deeper understanding of underlying distributions."
            },
            {
                q: "What statistical principle does 'Anscombe's Quartet' primarily demonstrate?",
                snippet: "# Datasets I, II, III, and IV have identical means and variances.\n# Yet, plotting them reveals completely different relationships.",
                options: [
                    "The Central Limit Theorem applies only to normally distributed data.",
                    "Summary statistics can be highly misleading; visualization is crucial for exploring data.",
                    "Linear regression is immune to outliers in small datasets.",
                    "Correlation implies causation in uniform distributions."
                ],
                correct: 1,
                theory: "Anscombe's Quartet consists of four datasets that have nearly identical descriptive statistics (mean, variance, correlation, regression line), yet appear entirely different when graphed. It underscores the necessity of Data Visualization before Model Planning."
            },
            {
                q: "How do Pandas and NumPy calculate variance differently by default?",
                snippet: "import pandas as pd, numpy as np\narr = [1, 2, 3, 4, 5]\nprint(np.var(arr) == pd.Series(arr).var())",
                options: ["True", "False", "Error", "Depends on data type"],
                correct: 1,
                theory: "NumPy calculates population variance by default (Delta Degrees of Freedom, `ddof=0`), dividing by N. Pandas calculates sample variance by default (`ddof=1`), dividing by N-1. Hence, the outputs are slightly different unless you explicitly align the `ddof` parameters."
            },
            {
                q: "In a heavily right-skewed income dataset, which central tendency relationship is generally true?",
                snippet: "mean_income = df['income'].mean()\nmedian_income = df['income'].median()",
                options: ["Mean < Median", "Mean = Median", "Mean > Median", "Cannot be determined"],
                correct: 2,
                theory: "In right-skewed (positive skew) data, large outlier values pull the mean towards the right tail. The median, being resistant to outliers, stays closer to the bulk of the data. Thus, the Mean is typically greater than the Median."
            },
            {
                q: "Calculate the upper bound for outliers using the Interquartile Range (IQR) method:",
                snippet: "Q1 = 25\nQ3 = 75\n# What is the standard upper bound formula?",
                options: ["Q3 + 1.5 * (Q3 - Q1)", "Q3 + 2.0 * Q1", "Q1 + 1.5 * (Q3 + Q1)", "Q3 * 1.5"],
                correct: 0,
                theory: "The IQR is Q3 - Q1 (75 - 25 = 50). The standard threshold to detect outliers is 1.5 times the IQR above the third quartile (Q3 + 1.5*IQR) and below the first quartile (Q1 - 1.5*IQR)."
            },
            {
                q: "Identify the result of applying Bayes' Theorem given the parameters:",
                snippet: "P(A) = 0.01   # Probability of Disease\nP(B|A) = 0.90 # True Positive Rate\nP(B|~A) = 0.05 # False Positive Rate\n# Calculate P(A|B)",
                options: ["0.900", "0.010", "Approx 0.154", "Approx 0.950"],
                correct: 2,
                theory: "Bayes Theorem: P(A|B) = [P(B|A)*P(A)] / P(B).\nP(B) = P(B|A)P(A) + P(B|~A)P(~A) = (0.90*0.01) + (0.05*0.99) = 0.009 + 0.0495 = 0.0585.\nP(A|B) = 0.009 / 0.0585 ≈ 0.1538. This explains the 'base rate fallacy' in medical diagnosis."
            },
            {
                q: "What defines two events A and B as 'independent' in probability?",
                snippet: "P(A) = 0.4\nP(B) = 0.5\nP(A ∩ B) = ?",
                options: ["P(A ∩ B) = P(A) + P(B)", "P(A ∩ B) = 0", "P(A ∩ B) = P(A) * P(B) = 0.2", "P(A ∩ B) = P(A|B)"],
                correct: 2,
                theory: "Two events are independent if the occurrence of one does not affect the occurrence of the other. Mathematically, their joint probability equals the product of their marginal probabilities: P(A ∩ B) = P(A) * P(B)."
            },
            {
                q: "Which SciPy function provides the cumulative probability up to a specific z-score in a Normal Distribution?",
                snippet: "from scipy.stats import norm\nz = 1.96\n# probability = norm._____(z)",
                options: ["norm.pdf", "norm.pmf", "norm.cdf", "norm.ppf"],
                correct: 2,
                theory: "CDF (Cumulative Distribution Function) returns the probability that a random variable taken from a standard normal distribution will be less than or equal to `z`. At z=1.96, the CDF is approx 0.975."
            },
            {
                q: "When should you use the Poisson distribution instead of the Binomial distribution?",
                snippet: "import scipy.stats as stats\n# Model selection phase",
                options: [
                    "When analyzing continuous spatial data.",
                    "When predicting the number of events over a fixed continuous interval of time or space.",
                    "When evaluating exact binary (Success/Fail) outcomes with a fixed number of trials 'n'.",
                    "When standard deviation equals zero."
                ],
                correct: 1,
                theory: "The Poisson distribution models the number of events occurring in a fixed interval of time or space, assuming these events happen with a known constant mean rate and independently. Binomial requires a fixed discrete number of trials."
            },
            {
                q: "What is the core premise of the Central Limit Theorem (CLT)?",
                snippet: "# Regardless of the underlying population distribution:\nsample_means = [np.mean(np.random.choice(data, 30)) for _ in range(1000)]",
                options: [
                    "All random variables inherently follow a normal distribution.",
                    "The mean of the samples will exactly equal the population median.",
                    "The distribution of sample means approaches a normal distribution as sample size gets larger.",
                    "Variance decreases to zero as sample size approaches infinity."
                ],
                correct: 2,
                theory: "The CLT states that the sampling distribution of the sample mean will be approximately normally distributed, regardless of the population's distribution, provided the sample size is sufficiently large (usually n > 30)."
            },
            {
                q: "Interpret the output of a covariance matrix between Variable X and Y:",
                snippet: "cov_matrix = np.cov(X, Y)\n# [[ 2.0, -1.5],\n#  [-1.5,  3.0]]",
                options: [
                    "X and Y have a perfectly linear inverse relationship.",
                    "X and Y tend to move in opposite directions.",
                    "X and Y are completely independent.",
                    "The variance of X is 3.0."
                ],
                correct: 1,
                theory: "The diagonal values (2.0, 3.0) represent the variances of X and Y. The off-diagonal values (-1.5) represent the covariance. A negative covariance indicates an inverse directional relationship: when X increases, Y tends to decrease."
            },
            {
                q: "Why might Spearman correlation be preferred over Pearson correlation?",
                snippet: "from scipy.stats import spearmanr, pearsonr\n# X = [1, 2, 3, 4, 100]\n# Y = [2, 4, 6, 8, 200]",
                options: [
                    "Spearman evaluates monotonic relationships and is robust to outliers.",
                    "Spearman assumes normally distributed, continuous data.",
                    "Spearman is computationally much faster for matrices.",
                    "Pearson cannot calculate inverse correlations."
                ],
                correct: 0,
                theory: "Pearson measures linear relationships and is highly sensitive to outliers. Spearman assesses monotonic relationships by comparing the *ranks* of the data rather than raw values, making it robust against extreme outliers."
            },
            {
                q: "What parameter in `scipy.stats.ttest_ind` specifies Welch's T-test instead of Student's T-test?",
                snippet: "from scipy.stats import ttest_ind\nt_stat, p_val = ttest_ind(group1, group2, ______)",
                options: ["alternative='two-sided'", "equal_var=False", "nan_policy='omit'", "paired=True"],
                correct: 1,
                theory: "Setting `equal_var=False` triggers Welch's t-test, which does not assume the two populations have equal variances. This is safer and more robust for real-world analytical problems compared to Student's t-test."
            },
            {
                q: "In a Chi-Square test of independence, what does the p-value indicate if it is 0.01 (alpha = 0.05)?",
                snippet: "from scipy.stats import chi2_contingency\nchi2, p, dof, expected = chi2_contingency(observed_table)",
                options: [
                    "Accept the null hypothesis; the categorical variables are independent.",
                    "Reject the null hypothesis; there is a significant association between the variables.",
                    "The test failed due to insufficient degrees of freedom.",
                    "There is a 1% chance the alternative hypothesis is true."
                ],
                correct: 1,
                theory: "The Null Hypothesis for a Chi-Square test is that the variables are independent. Since p (0.01) < alpha (0.05), we reject the null hypothesis and conclude there is statistically significant evidence of an association."
            },
            {
                q: "In the context of hypothesis testing in Medical Diagnosis, what represents a Type II Error?",
                snippet: "H0: The patient is healthy (no disease).\nH1: The patient has the disease.",
                options: [
                    "Diagnosing a healthy person as sick (False Positive).",
                    "Failing to diagnose a sick person (False Negative).",
                    "Correctly identifying a sick person (True Positive).",
                    "Rejecting H0 when H0 is false."
                ],
                correct: 1,
                theory: "A Type II error occurs when you fail to reject a false null hypothesis. Here, H0 is 'Healthy'. If H0 is false (they are sick), but we fail to reject H0 (we say they are healthy), it's a False Negative."
            },
            {
                q: "Which type of analytics answers the question: 'What should we do about it?'",
                snippet: "# 1. Descriptive -> What happened?\n# 2. Predictive -> What will happen?\n# 3. __________ -> What should we do?",
                options: ["Diagnostic Analytics", "Prescriptive Analytics", "Cognitive Analytics", "Reporting Analytics"],
                correct: 1,
                theory: "Prescriptive Analytics leverages optimization and simulation algorithms to advise on possible outcomes and recommend actions to maximize a business goal."
            },
            {
                q: "How does a Decision Tree algorithm primarily choose the best attribute to split data?",
                snippet: "from sklearn.tree import DecisionTreeClassifier\nclf = DecisionTreeClassifier(criterion='entropy')",
                options: [
                    "By maximizing the p-value of a Chi-Square test at each node.",
                    "By finding the split that maximizes Information Gain (reduces Entropy/Gini).",
                    "By calculating the Euclidean distance between categorical variables.",
                    "By applying Gradient Descent to weights."
                ],
                correct: 1,
                theory: "Decision trees segment data progressively by choosing splits that result in the highest Information Gain (i.e., making the resulting child nodes as pure/homogeneous as possible, minimizing entropy or Gini impurity)."
            },
            {
                q: "What is the consequence of setting `min_samples_split=2` and no `max_depth` in a Decision Tree?",
                snippet: "clf = DecisionTreeClassifier(min_samples_split=2, max_depth=None)\nclf.fit(X_train, y_train)",
                options: [
                    "High bias, resulting in underfitting.",
                    "The model will likely memorize the training data, leading to extreme overfitting.",
                    "The tree will only have one root and two leaves.",
                    "It will cause a continuous loop."
                ],
                correct: 1,
                theory: "Without pruning constraints (`max_depth=None`, `min_samples_split=2`), the tree will continue to expand until every leaf is perfectly pure. This memorizes noise in the training data, achieving 100% training accuracy but poor generalization (overfitting)."
            },
            {
                q: "In Multiple Linear Regression, how do you interpret a coefficient of 2.5 for feature X1?",
                snippet: "from sklearn.linear_model import LinearRegression\n# y = 1.0 + 2.5*X1 - 0.8*X2",
                options: [
                    "For every 1 unit increase in X1, y increases by 2.5 units, holding all other variables constant.",
                    "X1 is 2.5 times more important than X2.",
                    "X1 causes y to increase by 2.5%.",
                    "The correlation between X1 and y is exactly 2.5."
                ],
                correct: 0,
                theory: "In regression analysis, coefficients represent the average change in the dependent variable (y) for a one-unit change in the predictor variable, assuming all other independent variables remain constant."
            },
            {
                q: "What does Logistic Regression use to map predicted values to probabilities between 0 and 1?",
                snippet: "from sklearn.linear_model import LogisticRegression\nmodel = LogisticRegression()\n# y_pred_prob = model.predict_proba(X_test)",
                options: ["Softmax function (exclusively)", "Sigmoid function", "ReLU activation", "Tanh function"],
                correct: 1,
                theory: "Logistic Regression applies the Sigmoid function (Logistic function), $f(x) = \\frac{1}{1 + e^{-x}}$, to transform a linear combination of inputs into a probability curve constrained between 0 and 1."
            },
            {
                q: "What is the primary purpose of K-Fold Cross Validation?",
                snippet: "from sklearn.model_selection import cross_val_score, KFold\nkf = KFold(n_splits=5)\nscores = cross_val_score(model, X, y, cv=kf)",
                options: [
                    "To increase the processing speed of model training.",
                    "To evaluate model generalization by training and testing on different overlapping subsets.",
                    "To automatically drop irrelevant features from the dataset.",
                    "To handle missing data iteratively."
                ],
                correct: 1,
                theory: "Cross-validation is a technique to assess how the results of a statistical analysis will generalize to an independent dataset. It splits data into 'K' folds, iteratively training on K-1 folds and validating on the remaining fold, avoiding overfitting."
            },
            {
                q: "If your model has 98% Training Accuracy but 62% Testing Accuracy, what is the diagnosis?",
                snippet: "print(f'Train Score: {model.score(X_train, y_train)}')\nprint(f'Test Score: {model.score(X_test, y_test)}')",
                options: ["Underfitting (High Bias)", "Overfitting (High Variance)", "Perfectly calibrated", "Data leakage"],
                correct: 1,
                theory: "A massive gap between training accuracy (high) and test accuracy (low) is the classic symptom of Overfitting. The model has learned the noise and specific details of the training set rather than generalized underlying patterns."
            },
            {
                q: "In an imbalanced dataset (e.g., 99% non-fraud, 1% fraud), why is Accuracy a misleading evaluation metric?",
                snippet: "from sklearn.metrics import accuracy_score\ny_true = [0]*99 + [1]*1\ny_pred = [0]*100 # Model predicts NO fraud every time\nprint(accuracy_score(y_true, y_pred)) # Outputs 0.99",
                options: [
                    "Because precision and recall are mathematically identical to accuracy.",
                    "Because a naive model predicting only the majority class achieves 99% accuracy but fails its business objective.",
                    "Because accuracy cannot calculate continuous probabilities.",
                    "Because the data needs to be scaled first."
                ],
                correct: 1,
                theory: "Accuracy merely measures total correct predictions. In highly skewed data, simply guessing the dominant class yields high accuracy while completely missing the minority class (the actual goal, like detecting fraud). Precision, Recall, and F1-score are required."
            },
            {
                q: "How is the F1-Score calculated?",
                snippet: "from sklearn.metrics import f1_score\n# F1 balances the trade-off between False Positives and False Negatives.",
                options: [
                    "Arithmetic mean of Precision and Recall",
                    "Precision divided by Recall",
                    "Harmonic mean of Precision and Recall: 2 * (Precision * Recall) / (Precision + Recall)",
                    "Area Under the ROC Curve"
                ],
                correct: 2,
                theory: "The F1 score is the harmonic mean of precision and recall. It severely punishes extreme values; if either Precision or Recall is low, the F1 score will drop significantly, making it ideal for evaluating uneven models."
            },
            {
                q: "What does the ROC-AUC score measure in binary classification?",
                snippet: "from sklearn.metrics import roc_auc_score\nauc = roc_auc_score(y_test, y_pred_proba)",
                options: [
                    "The model's ability to discriminate between the positive and negative classes.",
                    "The exact percentage of True Positives.",
                    "The ratio of variance explained by the model.",
                    "The loss of the neural network during training."
                ],
                correct: 0,
                theory: "Area Under the Receiver Operating Characteristic Curve (ROC-AUC) plots True Positive Rate vs False Positive Rate. A score of 0.5 is random guessing; 1.0 is perfect class separation capability."
            },
            {
                q: "What is the primary difference between Factor Analysis (FA) and Principal Component Analysis (PCA)?",
                snippet: "from sklearn.decomposition import FactorAnalysis, PCA",
                options: [
                    "FA only works with categorical data, PCA only works with numerical.",
                    "PCA is used to identify unobservable latent variables; FA just compresses data.",
                    "PCA maximizes total variance to reduce dimensionality; FA models the underlying unobservable (latent) factors causing the correlation.",
                    "There is no mathematical difference; they are aliases."
                ],
                correct: 2,
                theory: "PCA is a linear combination of variables to maximize variance (pure dimensionality reduction). Factor Analysis assumes that observed variables are caused by underlying latent factors and unique error variances."
            },
            {
                q: "In KNIME Analytics Platform, how is the data analytics pipeline primarily constructed?",
                snippet: "# KNIME is a low-code analytics platform.",
                options: [
                    "By writing purely Python and R scripts in a console.",
                    "By connecting graphical 'Nodes' representing data access, transformation, modeling, and visualization into a workflow.",
                    "By compiling C++ binaries for each model.",
                    "By using only pre-trained LLMs to interpret CSVs."
                ],
                correct: 1,
                theory: "KNIME operates on a visual programming paradigm. Users drag, drop, and connect 'Nodes' (which encapsulate distinct functions like row filtering, decision tree learning, etc.) to create reproducible data workflows."
            },
            {
                q: "Why is Feature Scaling (Standardization/Normalization) critical before using K-Nearest Neighbors (KNN)?",
                snippet: "from sklearn.preprocessing import StandardScaler\nfrom sklearn.neighbors import KNeighborsClassifier",
                options: [
                    "To satisfy the normal distribution assumption of KNN.",
                    "Because KNN relies on distance metrics (like Euclidean); variables with larger scales will mathematically dominate the distance calculation.",
                    "To reduce the number of features.",
                    "To prevent the algorithm from returning negative neighbors."
                ],
                correct: 1,
                theory: "KNN classifies a point based on the 'closest' points. If Age ranges from 20-60 and Salary ranges from 50,000-100,000, the raw Euclidean distance will be almost entirely determined by Salary unless the features are scaled to a common range."
            },
            {
                q: "What 'naive' assumption gives the Naive Bayes classifier its name?",
                snippet: "from sklearn.naive_bayes import GaussianNB\nnb = GaussianNB()",
                options: [
                    "It assumes all data is normally distributed.",
                    "It assumes all features are conditionally independent given the class label.",
                    "It assumes the dataset contains no missing values.",
                    "It assumes probabilities are always greater than zero."
                ],
                correct: 1,
                theory: "The Naive Bayes algorithm calculates probabilities by applying Bayes' theorem with the 'naive' assumption that the presence of a particular feature in a class is entirely unrelated to the presence of any other feature."
            },
            {
                q: "When using SciPy's `linprog` for Linear Optimization, how do you handle maximization if the function only minimizes?",
                snippet: "from scipy.optimize import linprog\n# Objective function to MAXIMIZE: Z = 3x + 5y\nc = [3, 5] ",
                options: [
                    "Pass a special max=True flag.",
                    "Multiply the objective coefficients `c` by -1.",
                    "Use non-linear optimization instead.",
                    "Square the constraints."
                ],
                correct: 1,
                theory: "Optimization algorithms in scipy (`linprog`) are designed to minimize an objective function. To maximize Z, you minimize the negative of the function: minimize -Z = -3x - 5y."
            },
            {
                q: "Which technique is most effective for Data Preparation when dealing with high-cardinality nominal categorical variables in a tree-based model?",
                snippet: "# The 'City' column has 500 unique string values.",
                options: ["One-Hot Encoding", "Label Encoding", "Target Encoding", "Dropping the column immediately"],
                correct: 2,
                theory: "One-Hot Encoding 500 cities creates 500 sparse columns, devastating performance and memory. Label encoding implies an incorrect ordinal relationship. Target Encoding replaces the category with the mean of the target variable, making it highly effective for high-cardinality nominal data."
            },
            {
                q: "In Risk Analysis Simulation, what is a 'Monte Carlo' simulation primarily used for?",
                snippet: "import numpy as np\n# Running 10,000 iterations to predict profit",
                options: [
                    "To encrypt sensitive data before deployment.",
                    "To evaluate the probability of different outcomes in a process that cannot easily be predicted due to the intervention of random variables.",
                    "To cluster text documents by topic.",
                    "To optimize SQL queries in data warehouses."
                ],
                correct: 1,
                theory: "Monte Carlo simulations model the probability of different outcomes by running thousands of iterations using random sampling from probability distributions, providing a risk-assessment range rather than a single-point estimate."
            },
            {
                q: "What defines 'Spurious Correlation' in data analytics?",
                snippet: "correlation_coefficient = 0.95\n# Variable X: Ice cream sales\n# Variable Y: Shark attacks",
                options: [
                    "A correlation coefficient less than 0.",
                    "A mathematical relationship in which two or more events or variables are associated but not causally related, often due to a hidden third factor.",
                    "A perfect correlation of 1.0.",
                    "A correlation caused exclusively by rounding errors."
                ],
                correct: 1,
                theory: "Spurious correlations occur when two variables appear highly correlated but have no direct causal link. Usually, a confounding variable (e.g., Summer/Heat causes both higher ice cream sales and more people at the beach) is the actual cause. Correlation ≠ Causation."
            },
            {
                q: "During 'Model planning' and 'Model building', what is the holdout method?",
                snippet: "# Validation strategy setup",
                options: [
                    "Holding all numerical variables constant to observe categorical effects.",
                    "Pausing the analytics lifecycle until management approval.",
                    "Splitting the data into distinct, non-overlapping training and testing sets to evaluate unseen generalization.",
                    "Removing outliers before fitting the model."
                ],
                correct: 2,
                theory: "The Holdout evaluation splits data into sets (typically Train/Test/Validation). Models are trained on one set and evaluated on the 'holdout' set to verify that the model generalizes properly to new, unseen data, directly addressing overfitting."
            }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let timeLeft = 60 * 60; // 60 minutes in seconds
        let timerInterval;

        // UI Elements
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionContainer = document.getElementById('question-container');
        const progressEl = document.getElementById('progress');
        const timerEl = document.getElementById('timer');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        const feedbackContainer = document.getElementById('feedback-container');

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz();
                    return;
                }
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if(timeLeft < 300) { // last 5 minutes
                    timerEl.classList.add('urgent');
                }
            }, 1000);
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            progressEl.textContent = `Question ${currentQuestionIndex + 1} / ${questions.length}`;
            
            let html = `
                <div class="question-text">${currentQuestionIndex + 1}. ${q.q}</div>
                <pre><code>${q.snippet.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>
                <div class="options">
            `;

            const answered = userAnswers[currentQuestionIndex] !== null;
            const userAnswer = userAnswers[currentQuestionIndex];

            q.options.forEach((opt, index) => {
                let statusClass = '';
                let checked = userAnswer === index ? 'checked' : '';
                
                if (answered) {
                    if (index === q.correct) {
                        statusClass = 'correct';
                    } else if (index === userAnswer) {
                        statusClass = 'wrong';
                    }
                }

                html += `
                    <label class="option-label ${statusClass} ${answered ? 'disabled' : ''}">
                        <input type="radio" name="option" value="${index}" ${checked} ${answered ? 'disabled' : ''} onclick="selectOption(${index})">
                        ${opt.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
                    </label>
                `;
            });

            html += `</div>`;
            questionContainer.innerHTML = html;

            // Handle UI state
            prevBtn.disabled = currentQuestionIndex === 0;
            if (currentQuestionIndex === questions.length - 1) {
                nextBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                submitBtn.classList.add('hidden');
            }

            // Show feedback if already answered
            if (answered) {
                showFeedback(q, userAnswer);
            } else {
                feedbackContainer.classList.remove('show');
            }
        }

        function selectOption(index) {
            if (userAnswers[currentQuestionIndex] !== null) return; // Prevent changing answer
            
            userAnswers[currentQuestionIndex] = index;
            const q = questions[currentQuestionIndex];
            
            // Re-render to show correct/wrong highlighting
            loadQuestion();
        }

        function showFeedback(questionObj, userSelectedIndex) {
            const isCorrect = userSelectedIndex === questionObj.correct;
            
            let icon = isCorrect ? '✅ Correct' : '❌ Incorrect';
            let color = isCorrect ? 'var(--success)' : 'var(--danger)';
            let bgColor = isCorrect ? 'var(--success-light)' : 'var(--danger-light)';

            feedbackContainer.style.backgroundColor = bgColor;
            feedbackContainer.style.border = `2px solid ${color}`;
            feedbackContainer.style.color = '#1f2937';
            
            feedbackContainer.innerHTML = `
                <h3 style="color: ${color}">${icon}</h3>
                <div class="theory-content">
                    <strong>Explanation:</strong> ${questionObj.theory}
                </div>
            `;
            feedbackContainer.classList.add('show');
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function submitQuiz() {
            clearInterval(timerInterval);
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            generateReview();
            window.scrollTo(0, 0);
        }

        function generateReview() {
            let score = 0;
            let reviewHtml = '';

            questions.forEach((q, index) => {
                const userAns = userAnswers[index];
                const isCorrect = userAns === q.correct;
                if (isCorrect) score++;

                let statusClass = 'unanswered-bg';
                if (userAns !== null) {
                    statusClass = isCorrect ? 'correct-bg' : 'wrong-bg';
                }

                const userAnsText = userAns !== null ? q.options[userAns].replace(/</g, "&lt;").replace(/>/g, "&gt;") : "<em>Unanswered</em>";
                const correctAnsText = q.options[q.correct].replace(/</g, "&lt;").replace(/>/g, "&gt;");

                reviewHtml += `
                    <div class="review-item ${statusClass}">
                        <strong>Q${index + 1}: ${q.q}</strong>
                        <pre><code>${q.snippet.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>
                        <p><strong>Your Answer:</strong> <span style="color: ${isCorrect ? 'var(--success)' : (userAns===null ? 'var(--warning)' : 'var(--danger)')}">${userAnsText}</span></p>
                        ${!isCorrect ? `<p><strong>Correct Answer:</strong> <span style="color: var(--success)">${correctAnsText}</span></p>` : ''}
                        <div class="review-theory">
                            <strong>Theory Review:</strong><br>
                            ${q.theory}
                        </div>
                    </div>
                `;
            });

            const scorePercentage = ((score / questions.length) * 100).toFixed(1);
            document.getElementById('score-display').textContent = `Final Score: ${score} / ${questions.length}`;
            document.getElementById('score-percentage').textContent = `Accuracy: ${scorePercentage}%`;
            document.getElementById('review-container').innerHTML = reviewHtml;
        }

        // Initialize
        loadQuestion();
        startTimer();
    </script>
</body>
</html>
