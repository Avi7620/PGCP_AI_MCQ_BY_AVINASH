<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Data Analytics Quiz (PGCP-AI)</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background: var(--card-bg);
            max-width: 900px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 30px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--bg);
        }

        .timer {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text);
            background: #e5e7eb;
            padding: 5px 15px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .timer.urgent {
            color: white;
            background: var(--danger);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .question-progress {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-light);
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 500;
            line-height: 1.5;
        }

        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 1.05rem;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .option-label:hover:not(.disabled) {
            background-color: #f9fafb;
            border-color: #d1d5db;
        }

        .option-label input {
            margin-right: 15px;
            transform: scale(1.2);
            cursor: pointer;
        }

        .option-label.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .option-label.correct {
            border-color: var(--success);
            background-color: var(--success-light);
            color: #065f46;
            font-weight: bold;
        }

        .option-label.wrong {
            border-color: var(--danger);
            background-color: var(--danger-light);
            color: #991b1b;
            font-weight: bold;
        }

        .feedback-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            animation: fadeIn 0.4s;
            margin-bottom: 20px;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box h3 {
            margin-top: 0;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theory-content {
            font-size: 0.95rem;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        button {
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        
        #submit-btn { background-color: var(--warning); color: #000; }
        #submit-btn:hover { background-color: #d97706; color: white;}

        .hidden { display: none !important; }

        /* Review Section */
        #score-display {
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--primary);
        }
        .score-subtitle {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 30px;
        }

        .review-item {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fdfdfd;
        }
        .review-item.correct-bg { border-left: 5px solid var(--success); }
        .review-item.wrong-bg { border-left: 5px solid var(--danger); }
        .review-item.unanswered-bg { border-left: 5px solid var(--warning); }
        
        .review-theory {
            margin-top: 15px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 6px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-screen">
        <div class="header">
            <div class="question-progress" id="progress">Question 1 / 40</div>
            <div class="timer" id="timer">60:00</div>
        </div>

        <div id="question-container"></div>
        <div id="feedback-container" class="feedback-box"></div>

        <div class="controls">
            <button id="prev-btn" onclick="prevQuestion()">Previous</button>
            <button id="next-btn" onclick="nextQuestion()">Next</button>
            <button id="submit-btn" class="hidden" onclick="submitQuiz()">Submit Quiz</button>
        </div>
    </div>

    <div class="quiz-container hidden" id="result-screen">
        <div id="score-display"></div>
        <div class="score-subtitle" id="score-percentage"></div>
        <h2>Detailed Review & Explanations</h2>
        <div id="review-container"></div>
    </div>

    <script>
        const questions = [
    {
        q: "Which of the following best describes the 'Curse of Dimensionality' in the context of K-Nearest Neighbors (KNN)?",
        options: [
            "As dimensions increase, the computational time decreases exponentially.",
            "As dimensions increase, the distance between any two points becomes almost identical, making 'nearest' neighbors meaningless.",
            "As dimensions increase, the algorithm automatically drops less important features.",
            "As dimensions increase, the model becomes too biased and underfits the data."
        ],
        correct: 1,
        theory: "In high-dimensional spaces, the volume of the space increases so fast that the available data becomes sparse. This sparsity means that the mathematical difference between the closest point and the farthest point approaches zero, rendering distance metrics like Euclidean distance ineffective."
    },
    {
        q: "What is the primary theoretical advantage of using Stratified K-Fold Cross Validation over standard K-Fold?",
        options: [
            "It runs significantly faster by skipping redundant folds.",
            "It ensures that each fold contains the exact same number of overall samples.",
            "It ensures that the distribution of the target class is preserved equally across all folds.",
            "It automatically standardizes the features during the splitting process."
        ],
        correct: 2,
        theory: "Stratification forces each fold to have the same proportion of class labels as the original dataset. This is crucial for imbalanced datasets, preventing a scenario where a training or testing fold lacks representation of a minority class."
    },
    {
        q: "In Support Vector Machines (SVM), what is the theoretical purpose of the 'Kernel Trick'?",
        options: [
            "To implicitly map data into a higher-dimensional space where it becomes linearly separable without explicitly calculating the transformation.",
            "To reduce the dimensionality of the dataset before applying the linear boundary.",
            "To automatically remove extreme outliers from the support vectors.",
            "To convert continuous regression targets into categorical class labels."
        ],
        correct: 0,
        theory: "The kernel trick allows SVMs to solve non-linear classification problems. It calculates the dot products of data points in a high-dimensional feature space without ever actually transforming the data into that space, saving massive computational resources."
    },
    {
        q: "What is the core theoretical assumption of the Naive Bayes classifier regarding its input features?",
        options: [
            "All features must follow a uniform distribution.",
            "All features are perfectly correlated with each other.",
            "All features are conditionally independent of each other given the class label.",
            "All features must be scaled to a range between 0 and 1."
        ],
        correct: 2,
        theory: "Naive Bayes applies Bayes' theorem with the 'naive' assumption that the presence of one feature does not affect the presence of another, given the target class. Even though this assumption is rarely true in real life, the algorithm still performs surprisingly well on tasks like text classification."
    },
    {
        q: "In the context of Principal Component Analysis (PCA), what do the Eigenvalues theoretically represent?",
        options: [
            "The coordinates of the original data points in the new space.",
            "The amount of variance explained by their corresponding Principal Component (Eigenvector).",
            "The correlation coefficient between the first and second dimensions.",
            "The margin of error for the dimensionality reduction."
        ],
        correct: 1,
        theory: "In PCA, the covariance matrix is decomposed into eigenvectors and eigenvalues. The eigenvector determines the direction of the new feature axis (the principal component), and the eigenvalue represents the magnitude (variance) of the data along that new axis."
    },
    {
        q: "What is the theoretical distinction between Missing Completely at Random (MCAR) and Missing Not at Random (MNAR)?",
        options: [
            "MCAR means the missingness is related to another variable, while MNAR means it is completely random.",
            "MCAR means the probability of missing data is independent of any values, while MNAR means the missingness is related to the unobserved value itself.",
            "MCAR data can only be dropped, while MNAR data can be imputed.",
            "There is no theoretical difference; both require mean imputation."
        ],
        correct: 1,
        theory: "If data is MCAR, the missing values are random and dropping them doesn't bias the dataset. If data is MNAR, the fact that it is missing is related to the value it should have been (e.g., wealthy people refusing to disclose high incomes). MNAR introduces severe bias if ignored."
    },
    {
        q: "Why is 'Log Loss' (Cross-Entropy) theoretically preferred over 'Mean Squared Error' (MSE) for training Logistic Regression models?",
        options: [
            "MSE is computationally too heavy for binary targets.",
            "Log Loss strongly penalizes confident but incorrect predictions, whereas MSE creates a non-convex loss surface for probabilities, risking local minima.",
            "Log Loss automatically converts probabilities into absolute classes.",
            "MSE cannot be differentiated by gradient descent."
        ],
        correct: 1,
        theory: "Because Logistic Regression uses a sigmoid activation function, applying MSE results in a non-convex error surface with multiple local minima where gradient descent can get stuck. Log Loss guarantees a strictly convex loss surface, ensuring gradient descent finds the global minimum."
    },
    {
        q: "What does the 'Learning Rate' parameter theoretically control in Gradient Descent?",
        options: [
            "The number of epochs the model will train for.",
            "The size of the steps taken toward the minimum of the loss function during weight updates.",
            "The percentage of data used in each mini-batch.",
            "The ratio of L1 to L2 regularization applied to the weights."
        ],
        correct: 1,
        theory: "The learning rate scales the gradient before it is subtracted from the current weights. A learning rate that is too small makes training painfully slow, while one that is too large can cause the algorithm to continuously overshoot the minimum and diverge."
    },
    {
        q: "In Natural Language Processing (NLP), what is the primary theoretical flaw of the Bag-of-Words (BoW) model?",
        options: [
            "It cannot handle documents longer than 500 words.",
            "It ignores the order of words, completely losing grammatical structure and semantic context.",
            "It requires all text to be translated into a single language first.",
            "It uses massive amounts of RAM compared to word embeddings."
        ],
        correct: 1,
        theory: "Bag-of-Words represents text simply as a frequency count of words. It does not capture sequence, meaning 'The dog bit the man' and 'The man bit the dog' have the exact same mathematical representation."
    },
    {
        q: "What is the theoretical purpose of the 'Activation Function' in an Artificial Neural Network?",
        options: [
            "To initialize the random weights of the network.",
            "To introduce non-linearity into the network, allowing it to learn complex, non-linear patterns.",
            "To pool multiple outputs into a single scalar value.",
            "To prevent the network from overfitting the training data."
        ],
        correct: 1,
        theory: "Without an activation function (like ReLU or Sigmoid), a neural network is just a series of linear matrix multiplications. No matter how many layers it has, a purely linear network can only ever solve linear problems. Activation functions enable the learning of complex shapes and boundaries."
    },
    {
        q: "What phenomenon is the 'Vanishing Gradient Problem' theoretically referring to in Deep Learning?",
        options: [
            "When the loss function reaches zero and training stops prematurely.",
            "When gradients become infinitely large, causing the model weights to explode to NaN.",
            "When gradients become so small during backpropagation that the weights of the earliest layers barely update, stalling the learning process.",
            "When the learning rate decays too quickly during training."
        ],
        correct: 2,
        theory: "In deep networks (especially those using Sigmoid or Tanh activations), the gradient of the loss is multiplied by values less than 1 during backpropagation. Through many layers, this gradient shrinks exponentially, preventing the initial layers from learning meaningful features."
    },
    {
        q: "In clustering, what is the theoretical difference between K-Means and DBSCAN?",
        options: [
            "K-Means requires you to specify the number of clusters (K) in advance, while DBSCAN automatically discovers clusters based on data density.",
            "K-Means works well with non-globular shapes, while DBSCAN only handles spherical clusters.",
            "K-Means is robust to outliers, while DBSCAN forces every point into a cluster.",
            "There is no difference; they are variations of the same algorithm."
        ],
        correct: 0,
        theory: "K-Means groups data into 'K' spherical clusters and forces every point (even outliers) into a cluster. DBSCAN groups points that are closely packed together (high density), can discover arbitrarily shaped clusters, and explicitly identifies sparse points as 'noise' or outliers."
    },
    {
        q: "What theoretical advantage does the XGBoost algorithm have over a standard Random Forest?",
        options: [
            "XGBoost builds trees in parallel, making it fundamentally faster than a sequential Random Forest.",
            "XGBoost trees are deeper and therefore have lower variance.",
            "XGBoost optimizes an objective function using gradient descent to correct the residual errors of previous trees, reducing bias more effectively.",
            "XGBoost does not require hyperparameter tuning."
        ],
        correct: 2,
        theory: "Random Forests build trees independently and average them to reduce variance. XGBoost is a Gradient Boosting machine that builds trees sequentially; each new tree learns from the mistakes (residuals) of the entire ensemble before it, actively driving down the model's bias."
    },
    {
        q: "In statistical hypothesis testing, what is the theoretical definition of statistical 'Power'?",
        options: [
            "The probability of rejecting the null hypothesis when it is actually true (Type I error).",
            "The probability of correctly rejecting the null hypothesis when the alternative hypothesis is true (True Positive Rate).",
            "The strict threshold (alpha) set before the experiment begins.",
            "The probability that the sample mean equals the population mean."
        ],
        correct: 1,
        theory: "Statistical Power (1 - Beta) is the likelihood that a test will detect an effect if there is an effect to be detected. High power means you have a low probability of making a Type II error (False Negative)."
    },
    {
        q: "When comparing L1 (Lasso) and L2 (Ridge) regularization, what geometric theoretical property allows L1 to perform feature selection?",
        options: [
            "The L1 penalty constraint forms a diamond shape, making it highly probable that the gradient descent loss function will intersect it exactly at an axis (setting coefficients to zero).",
            "The L1 penalty uses squared terms, which forces smaller weights to zero faster than L2.",
            "L1 completely ignores correlation between features, dropping them randomly.",
            "L1 regularization adds features to the model sequentially."
        ],
        correct: 0,
        theory: "In a 2D space, the L2 constraint is a circle, while the L1 constraint is a diamond with sharp corners on the axes. The optimal solution (where the error contour hits the constraint) is highly likely to occur on a corner in L1, which means one or more feature weights become exactly zero."
    },
    {
        q: "What is the primary theoretical difference between 'Generative' and 'Discriminative' models?",
        options: [
            "Generative models predict a continuous target, Discriminative models predict a discrete target.",
            "Discriminative models learn the boundary between classes, Generative models learn the actual distribution of individual classes.",
            "Generative models cannot be used for classification.",
            "Discriminative models are unsupervised, Generative models are supervised."
        ],
        correct: 1,
        theory: "A Discriminative model (like Logistic Regression) focuses only on drawing the best line to separate dogs and cats. A Generative model (like Naive Bayes or GANs) tries to learn what a dog looks like and what a cat looks like independently, allowing it to generate new data points."
    },
    {
        q: "What does the 'Gini Impurity' theoretically measure in a Classification Decision Tree?",
        options: [
            "The continuous numerical variance of the target variable.",
            "The probability of incorrectly classifying a randomly chosen element if it were randomly labeled according to the distribution of labels in the subset.",
            "The absolute depth of the tree from root to leaf.",
            "The computational time required to make a split."
        ],
        correct: 1,
        theory: "Gini Impurity is a measurement of the likelihood of an incorrect classification of a new instance if it was randomly classified according to the distribution of classes in the node. A perfectly pure node (all samples belong to one class) has a Gini impurity of 0."
    },
    {
        q: "How does the 'SMOTE' (Synthetic Minority Over-sampling Technique) algorithm theoretically handle class imbalance?",
        options: [
            "By duplicating the existing minority class samples randomly.",
            "By randomly deleting samples from the majority class until it matches the minority class.",
            "By generating new, synthetic minority examples by interpolating between existing minority samples in the feature space.",
            "By changing the loss function to heavily penalize majority class predictions."
        ],
        correct: 2,
        theory: "Unlike simple random oversampling which just creates exact copies of data, SMOTE creates synthetic data points. It does this by drawing lines between existing minority points in the high-dimensional feature space and creating new points along those lines."
    },
    {
        q: "What is the theoretical implication of setting a very small 'k' value (e.g., k=1) in the K-Nearest Neighbors algorithm?",
        options: [
            "The model becomes highly biased, ignoring local fluctuations.",
            "The model creates a highly complex, jagged decision boundary, leading to low bias and high variance (overfitting).",
            "The model will perfectly generalize to all unseen data.",
            "The algorithm will automatically switch to a linear regression approach."
        ],
        correct: 1,
        theory: "If K=1, the model predicts the class of the single closest point. This means it memorizes the training data perfectly (0 bias on training), but the decision boundary becomes incredibly sensitive to noise and outliers, resulting in high variance and poor generalization."
    },
    {
        q: "In A/B Testing, what is a theoretical 'Type I Error'?",
        options: [
            "Concluding there is a significant difference between version A and B when there actually isn't (False Positive).",
            "Failing to notice a difference between version A and B when one actually exists (False Negative).",
            "Setting the sample size too small to achieve statistical significance.",
            "Having unequal traffic distribution between version A and version B."
        ],
        correct: 0,
        theory: "A Type I error occurs when you reject the null hypothesis (which states there is no difference) when it is true. In A/B testing, this means launching a 'winning' feature that is actually just a statistical fluke."
    },
    {
        q: "What theoretical advantage does the ReLU (Rectified Linear Unit) activation function offer over the Sigmoid function in deep neural networks?",
        options: [
            "ReLU smoothly maps all inputs to probabilities between 0 and 1.",
            "ReLU suffers less from the vanishing gradient problem because its derivative for positive inputs is exactly 1.",
            "ReLU ensures that the network never outputs exactly zero.",
            "ReLU automatically centers the data around zero, accelerating gradient descent."
        ],
        correct: 1,
        theory: "The Sigmoid function 'squashes' inputs into a small range, making gradients very close to zero at the extremes (vanishing gradients). ReLU outputs the input directly if positive, giving a constant gradient of 1, allowing errors to propagate successfully through very deep layers."
    },
    {
        q: "What is the theoretical purpose of 'Batch Normalization' during the training of neural networks?",
        options: [
            "To normalize the initial weights to standard Gaussian distributions.",
            "To reduce Internal Covariate Shift by standardizing the inputs of intermediate layers, allowing for higher learning rates and faster convergence.",
            "To convert all categorical data into normalized numerical batches.",
            "To automatically drop out random neurons to prevent overfitting."
        ],
        correct: 1,
        theory: "As a network trains, the distribution of inputs to inner layers constantly changes as prior layer weights update (Internal Covariate Shift). Batch Norm normalizes these intermediate inputs to have a mean of 0 and variance of 1, stabilizing and accelerating the training process."
    },
    {
        q: "In Time Series analysis, what does it theoretically mean for data to be 'Stationary'?",
        options: [
            "The data points do not change their absolute value over time.",
            "The statistical properties of the series, such as mean, variance, and autocorrelation, are constant over time.",
            "The time series consists exclusively of random noise.",
            "The data exhibits a clear upward or downward linear trend."
        ],
        correct: 1,
        theory: "Stationarity is a core assumption in models like ARIMA. A stationary series has no predictable patterns in the long term (no trend, no seasonality). If the mean and variance change over time, the mathematical rules governing the data are shifting, making future predictions unreliable without transformations."
    },
    {
        q: "What is the theoretical function of the 'Softmax' layer at the end of a neural network?",
        options: [
            "To normalize the output vector into a probability distribution where all values sum to 1.",
            "To convert the continuous output into absolute binary classes (0 or 1).",
            "To heavily penalize the largest output value to prevent overconfidence.",
            "To calculate the final loss error to be backpropagated."
        ],
        correct: 0,
        theory: "Softmax takes an array of raw numerical scores (logits) and applies an exponential function, normalizing them so that every element falls between 0 and 1, and the entire array sums to exactly 1.0. This allows the outputs to be interpreted as mutually exclusive probabilities."
    },
    {
        q: "Why is 'Cosine Similarity' theoretically preferred over 'Euclidean Distance' when comparing the similarity of text documents (TF-IDF vectors)?",
        options: [
            "Cosine similarity is faster to compute on sparse matrices.",
            "Cosine similarity measures the angle between vectors, ignoring magnitude. This means a short article and a long article on the exact same topic will be considered highly similar, whereas Euclidean distance would consider them far apart.",
            "Cosine similarity automatically removes stop words from the vectors.",
            "Euclidean distance cannot be applied to high-dimensional spaces."
        ],
        correct: 1,
        theory: "In text analysis, document length varies drastically. Euclidean distance is highly sensitive to the magnitude (length) of the vectors. Cosine similarity only measures the directional angle; if two documents have the same proportional word frequencies, their angle is 0, regardless of document length."
    },
    {
        q: "In the context of evaluating a classification model, what is the theoretical difference between the ROC Curve and the Precision-Recall (PR) Curve?",
        options: [
            "ROC evaluates multi-class problems; PR evaluates binary problems.",
            "ROC curves plot Sensitivity vs Specificity; PR curves plot Sensitivity vs Positive Predictive Value, making PR curves vastly superior for severely imbalanced datasets.",
            "There is no mathematical difference; PR is just an inverted ROC curve.",
            "ROC curves require unscaled data; PR curves require standardized data."
        ],
        correct: 1,
        theory: "The ROC curve plots True Positive Rate vs False Positive Rate. In a highly imbalanced dataset with many 'Negatives', a massive number of True Negatives keeps the FPR very low, creating an overly optimistic ROC curve. The PR curve ignores True Negatives, focusing strictly on the rare positive class."
    },
    {
        q: "What is the primary theoretical goal of an 'Autoencoder' neural network?",
        options: [
            "To generate entirely new text descriptions from images.",
            "To learn a compressed, lower-dimensional representation of the input data and then accurately reconstruct the original input from that compression.",
            "To automatically adjust hyperparameters without human intervention.",
            "To classify images into 1000 distinct categories."
        ],
        correct: 1,
        theory: "Autoencoders are unsupervised architectures consisting of an encoder (which compresses data into a bottleneck latent space) and a decoder (which tries to recreate the input). By forcing the data through the bottleneck, the network learns the most essential, non-linear features of the data."
    },
    {
        q: "When evaluating a Regression model, what does the R-squared (Coefficient of Determination) theoretically tell you?",
        options: [
            "The absolute average error of the predictions in the original units.",
            "The probability that the linear relationship is due to chance.",
            "The proportion of the variance in the dependent variable that is predictable from the independent variables.",
            "The ratio of the slope to the intercept in the regression equation."
        ],
        correct: 2,
        theory: "R-squared is a relative metric between 0 and 1. An R-squared of 0.80 means that 80% of the variance (the fluctuations) in the target variable can be mathematically explained by the input features in your model."
    },
    {
        q: "What is the theoretical mechanism of 'Dropout' regularization in training Neural Networks?",
        options: [
            "It drops the oldest data points from the training set to prevent memory leaks.",
            "It randomly sets a fraction of input units to 0 at each update during training time, forcing the network to learn redundant representations and preventing complex co-adaptations.",
            "It completely removes the layers with the lowest gradients at the end of training.",
            "It stops the training process early if the validation loss increases."
        ],
        correct: 1,
        theory: "Dropout is a powerful regularization technique. By randomly 'turning off' neurons during a training pass, the network cannot rely on any single neuron or specific pathway to make predictions. This forces the entire network to learn robust, generalized features."
    },
    {
        q: "In Convolutional Neural Networks (CNNs), what is the theoretical purpose of a 'Pooling' layer?",
        options: [
            "To increase the spatial dimensions of the image to recover lost details.",
            "To perform backpropagation on the filters.",
            "To aggressively reduce the spatial size of the representation, reducing the number of parameters and computation while achieving spatial translation invariance.",
            "To convert the 2D image matrices into a 1D vector for the output layer."
        ],
        correct: 2,
        theory: "Pooling layers (like Max Pooling) slide a window over the feature map and extract only the most prominent signal (the maximum value). This shrinks the image dimensions, reduces memory footprint, and makes the network insensitive to exact pixel locations (translation invariance)."
    },
    {
        q: "What is the theoretical definition of 'Multicollinearity' in Multiple Linear Regression?",
        options: [
            "When the target variable is highly correlated with the input variables.",
            "When the residuals (errors) of the model are not normally distributed.",
            "When two or more independent variables are highly correlated with each other, making it difficult to isolate the individual effect of each feature on the target.",
            "When the independent variables have completely different scales and units."

        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let timeLeft = 60 * 60; // 60 minutes in seconds
        let timerInterval;

        // UI Elements
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionContainer = document.getElementById('question-container');
        const progressEl = document.getElementById('progress');
        const timerEl = document.getElementById('timer');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        const feedbackContainer = document.getElementById('feedback-container');

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz();
                    return;
                }
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if(timeLeft < 300) { // last 5 minutes
                    timerEl.classList.add('urgent');
                }
            }, 1000);
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            progressEl.textContent = `Question ${currentQuestionIndex + 1} / ${questions.length}`;
            
            let html = `
                <div class="question-text">${currentQuestionIndex + 1}. ${q.q}</div>
                <pre><code>${q.snippet.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>
                <div class="options">
            `;

            const answered = userAnswers[currentQuestionIndex] !== null;
            const userAnswer = userAnswers[currentQuestionIndex];

            q.options.forEach((opt, index) => {
                let statusClass = '';
                let checked = userAnswer === index ? 'checked' : '';
                
                if (answered) {
                    if (index === q.correct) {
                        statusClass = 'correct';
                    } else if (index === userAnswer) {
                        statusClass = 'wrong';
                    }
                }

                html += `
                    <label class="option-label ${statusClass} ${answered ? 'disabled' : ''}">
                        <input type="radio" name="option" value="${index}" ${checked} ${answered ? 'disabled' : ''} onclick="selectOption(${index})">
                        ${opt.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
                    </label>
                `;
            });

            html += `</div>`;
            questionContainer.innerHTML = html;

            // Handle UI state
            prevBtn.disabled = currentQuestionIndex === 0;
            if (currentQuestionIndex === questions.length - 1) {
                nextBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                submitBtn.classList.add('hidden');
            }

            // Show feedback if already answered
            if (answered) {
                showFeedback(q, userAnswer);
            } else {
                feedbackContainer.classList.remove('show');
            }
        }

        function selectOption(index) {
            if (userAnswers[currentQuestionIndex] !== null) return; // Prevent changing answer
            
            userAnswers[currentQuestionIndex] = index;
            const q = questions[currentQuestionIndex];
            
            // Re-render to show correct/wrong highlighting
            loadQuestion();
        }

        function showFeedback(questionObj, userSelectedIndex) {
            const isCorrect = userSelectedIndex === questionObj.correct;
            
            let icon = isCorrect ? '✅ Correct' : '❌ Incorrect';
            let color = isCorrect ? 'var(--success)' : 'var(--danger)';
            let bgColor = isCorrect ? 'var(--success-light)' : 'var(--danger-light)';

            feedbackContainer.style.backgroundColor = bgColor;
            feedbackContainer.style.border = `2px solid ${color}`;
            feedbackContainer.style.color = '#1f2937';
            
            feedbackContainer.innerHTML = `
                <h3 style="color: ${color}">${icon}</h3>
                <div class="theory-content">
                    <strong>Explanation:</strong> ${questionObj.theory}
                </div>
            `;
            feedbackContainer.classList.add('show');
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function submitQuiz() {
            clearInterval(timerInterval);
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            generateReview();
            window.scrollTo(0, 0);
        }

        function generateReview() {
            let score = 0;
            let reviewHtml = '';

            questions.forEach((q, index) => {
                const userAns = userAnswers[index];
                const isCorrect = userAns === q.correct;
                if (isCorrect) score++;

                let statusClass = 'unanswered-bg';
                if (userAns !== null) {
                    statusClass = isCorrect ? 'correct-bg' : 'wrong-bg';
                }

                const userAnsText = userAns !== null ? q.options[userAns].replace(/</g, "&lt;").replace(/>/g, "&gt;") : "<em>Unanswered</em>";
                const correctAnsText = q.options[q.correct].replace(/</g, "&lt;").replace(/>/g, "&gt;");

                reviewHtml += `
                    <div class="review-item ${statusClass}">
                        <strong>Q${index + 1}: ${q.q}</strong>
                        <pre><code>${q.snippet.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>
                        <p><strong>Your Answer:</strong> <span style="color: ${isCorrect ? 'var(--success)' : (userAns===null ? 'var(--warning)' : 'var(--danger)')}">${userAnsText}</span></p>
                        ${!isCorrect ? `<p><strong>Correct Answer:</strong> <span style="color: var(--success)">${correctAnsText}</span></p>` : ''}
                        <div class="review-theory">
                            <strong>Theory Review:</strong><br>
                            ${q.theory}
                        </div>
                    </div>
                `;
            });

            const scorePercentage = ((score / questions.length) * 100).toFixed(1);
            document.getElementById('score-display').textContent = `Final Score: ${score} / ${questions.length}`;
            document.getElementById('score-percentage').textContent = `Accuracy: ${scorePercentage}%`;
            document.getElementById('review-container').innerHTML = reviewHtml;
        }

        // Initialize
        loadQuestion();
        startTimer();
    </script>
